name: Weekly Tapology Profile Refresh

on:
  schedule:
    - cron: '30 4 * * 0'  # Sunday 04:30 UTC, before the pre-UFC supplement scrape
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum profile-gap candidates to inspect
        required: false
        default: '20'
      probe_only:
        description: Only prove hosted Tapology access, without refreshing files
        required: false
        type: boolean
        default: false
      sync_active_roster:
        description: Sync UFC active-roster candidates before refreshing Tapology profiles
        required: false
        type: boolean
        default: false
      runner:
        description: GitHub-hosted runner pool to use
        required: false
        default: windows-latest
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest
      probe_name:
        description: Fighter name for the Tapology access probe
        required: false
        default: Feng Pengchao
      probe_url:
        description: Known Tapology profile URL for the access probe
        required: false
        default: https://www.tapology.com/fightcenter/fighters/230675-feng-peng-zhao-winged-tiger

permissions:
  contents: write

concurrency:
  group: tapology-profile-refresh
  cancel-in-progress: false

env:
  PYTHONPATH: .
  TAPOLOGY_BROWSER_FALLBACK_ENABLED: '1'
  TAPOLOGY_BROWSER_PAGE_TIMEOUT_SECONDS: '45'
  TAPOLOGY_BROWSER_READY_TIMEOUT_SECONDS: '45'
  TAPOLOGY_BROWSER_REQUEST_DELAY_SECONDS: '5'
  TAPOLOGY_READER_REQUEST_DELAY_SECONDS: '5'

jobs:
  refresh:
    runs-on: ${{ inputs.runner || 'windows-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install browser runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            sudo apt-get install -y chromium || sudo apt-get install -y chromium-browser
          fi
          if ! command -v chromedriver >/dev/null 2>&1; then
            sudo apt-get install -y chromium-driver || true
          fi
          google-chrome --version || chromium --version || chromium-browser --version
          chromedriver --version || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe hosted Tapology access
        shell: bash
        env:
          PROBE_NAME: ${{ inputs.probe_name || 'Feng Pengchao' }}
          PROBE_URL: ${{ inputs.probe_url || 'https://www.tapology.com/fightcenter/fighters/230675-feng-peng-zhao-winged-tiger' }}
        run: |
          set +e
          python scripts/refresh_tapology_profile_supplement.py --probe-only --probe-name "$PROBE_NAME" --probe-url "$PROBE_URL" --json | tee tapology-probe.json
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            FAILURE_KIND=$(python -c "import json; print(json.load(open('tapology-probe.json')).get('tapology_probe', {}).get('failure_kind', 'unknown'))" 2>/dev/null || echo unknown)
            echo "::error title=Tapology hosted access unavailable::Probe failed (${FAILURE_KIND}). The selected GitHub runner cannot currently fetch and parse the known Tapology profile."
            {
              echo "## Tapology access probe failed"
              echo ""
              echo "Failure kind: \`${FAILURE_KIND}\`"
              echo ""
              echo "The supplement refresh was stopped after the access/discovery probe failed; no green zero-progress run was reported."
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$STATUS"
          fi

      - name: Refresh Tapology profile supplement
        shell: bash
        env:
          PROBE_ONLY: ${{ inputs.probe_only || false }}
          REFRESH_LIMIT: ${{ inputs.limit || '20' }}
          SYNC_ACTIVE_ROSTER: ${{ inputs.sync_active_roster || false }}
        run: |
          if [ "$PROBE_ONLY" = "true" ]; then
            echo "probe_only=true; skipping refresh"
            exit 0
          fi
          if ! [[ "$REFRESH_LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid Tapology refresh limit::limit must be a positive integer"
            exit 64
          fi
          SYNC_ARGS=""
          if [ "$SYNC_ACTIVE_ROSTER" = "true" ]; then
            SYNC_ARGS="--sync-active-roster"
          fi
          set +e
          python scripts/refresh_tapology_profile_supplement.py $SYNC_ARGS --limit "$REFRESH_LIMIT" --require-source-health --json | tee tapology-refresh.json
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            ACTION=$(python -c "import json; print(json.load(open('tapology-refresh.json')).get('action', 'unknown'))" 2>/dev/null || echo unknown)
            if [ "$ACTION" = "configuration_error" ]; then
              echo "::error title=Tapology candidate universe unavailable::The hosted refresh found no eligible fighter candidates. Diagnostics are attached."
              {
                echo "## Tapology candidate configuration failed"
                echo ""
                echo "The access probe passed, but the refresh produced no eligible fighter universe. This run is failed instead of reporting a healthy no-op."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=Tapology source became unhealthy::The access probe passed, but candidate refreshes then hit source access or parser errors. Diagnostics are attached."
              {
                echo "## Tapology source health failed during refresh"
                echo ""
                echo "The initial probe passed, but one or more candidate requests failed at the source/parser layer."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$STATUS"
          fi
          PROGRESS_STATE=$(python -c "import json; print(json.load(open('tapology-refresh.json')).get('progress_state', 'unknown'))")
          if [ "$PROGRESS_STATE" = "no_fields_available" ]; then
            echo "::warning title=Tapology recovered no fields::Source access and parsing were healthy, but the attempted profiles did not publish any currently missing field. The backlog will rotate next run."
            {
              echo "## Tapology refresh completed without new fields"
              echo ""
              echo "Source health: healthy"
              echo ""
              echo "The attempted profiles exposed none of the missing fields Tapology can supply. This is not treated as an outage; the recoverable backlog rotates on the next run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Tapology diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tapology-refresh-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tapology-probe.json
            tapology-refresh.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit updated Tapology supplement if changed
        shell: bash
        run: |
          git diff --quiet -- data/raw/ufc_fighters_profile_supplement.csv && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ufc_fighters_profile_supplement.csv
          git commit -m "chore: weekly Tapology profile supplement refresh"
          git push
