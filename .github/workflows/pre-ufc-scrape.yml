name: Weekly Pre-UFC Scrape

on:
  schedule:
    - cron: '0 6 * * 0'  # Sunday 06:00 UTC
  workflow_dispatch:       # manual trigger from Actions tab

env:
  PYTHONPATH: .

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pre-UFC supplement scraper
        run: python scripts/build_pre_ufc_career_supplement.py --resume

      - name: Commit updated supplement if changed
        run: |
          git diff --quiet -- data/raw/pre_ufc_career_supplement_v2.csv data/raw/pre_ufc_career_checkpoint_v2.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/pre_ufc_career_supplement_v2.csv data/raw/pre_ufc_career_checkpoint_v2.json
          git commit -m "chore: weekly pre-UFC supplement refresh"
          git push
