name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  saved-production-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tracked source and artifact integrity
        run: |
          python tools/verify_release_source.py
          python scripts/check_tracked_artifact_integrity.py
      - name: Authenticate to the immutable private base image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Build and verify the saved production source
        run: docker build --network none -t ufc-saved-source:test .
      - name: Compile and test without network or application startup
        run: |
          docker run --rm --network none --entrypoint python \
            -e LIVE_TRADING_MODE=off -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/app -e PYTHONPYCACHEPREFIX=/tmp/ci-pyc \
            -v "$PWD/tests:/checks:ro" ufc-saved-source:test -c \
            "import compileall,shutil,pytest; shutil.copytree('/checks','/app/tests',dirs_exist_ok=True); assert compileall.compile_dir('/app/src',quiet=1) and compileall.compile_dir('/app/tests',quiet=1); raise SystemExit(pytest.main(['-q','-p','no:cacheprovider','/app/tests']))"
      - name: Check dashboard display scripts
        run: |
          node tests/check_dashboard_display.cjs
          node tests/check_prediction_semantics.cjs
          node tests/check_coverage_display.cjs src/web/static/dashboard-freshness.js
          node tests/verify_dashboard_history_template.js
      - name: Verify checks leave tracked files unchanged
        run: git diff --exit-code
