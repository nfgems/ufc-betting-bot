name: CI

on:
  push:
  pull_request:

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Smoke compile
        run: python -m compileall src tests
      - name: Check tracked artifact integrity
        run: python scripts/check_tracked_artifact_integrity.py
      - name: Build exact parity candidate
        run: |
          parity_dir="$RUNNER_TEMP/ufc-parity-candidate"
          python scripts/rebuild_ufc_processed_artifacts.py --output-subdir "$parity_dir"
          test -s "$parity_dir/fights_cleaned.csv"
          test -s "$parity_dir/features.csv"
          echo "UFC_PARITY_PROCESSED_DATA_DIR=$parity_dir" >> "$GITHUB_ENV"
          echo "UFC_PARITY_TRAINING_SPEC=full_live_contract_v6_durability_corrected_20260805_fullfit" >> "$GITHUB_ENV"
      - name: Run tests
        run: pytest -q tests/
      - name: Verify tests leave tracked files unchanged
        run: |
          if ! git diff --quiet; then
            echo "::error title=Tests modified tracked files::Tests must redirect runtime writes into temporary paths:"
            git diff --name-status
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t ufc-betting-bot .
