name: CI

on:
  push:
  pull_request:

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Smoke compile
        run: python -m compileall src tests
      - name: Run tests
        run: >
          pytest -q
          tests/test_live_control.py
          tests/test_web_runtime_api.py
          tests/test_web_activity_api.py
          tests/test_audit_remediations.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ufc-betting-bot .
