name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  saved-production-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tracked source and artifact integrity
        run: |
          python tools/verify_release_source.py
          python scripts/check_tracked_artifact_integrity.py
      - name: Build the public test environment
        run: docker build -f Dockerfile.ci -t ufc-public-tests .
      - name: Compile and test without network or application startup
        run: |
          docker run --rm --network none --entrypoint python ufc-public-tests -c \
            "import compileall,pytest; assert compileall.compile_dir('src',quiet=1) and compileall.compile_dir('tests',quiet=1); raise SystemExit(pytest.main(['-q','-p','no:cacheprovider','tests']))"
      - name: Check dashboard display scripts
        run: |
          node tests/check_dashboard_display.cjs
          node tests/check_prediction_semantics.cjs
          node tests/check_coverage_display.cjs src/web/static/dashboard-freshness.js
          node tests/verify_dashboard_history_template.js
      - name: Verify checks leave tracked files unchanged
        run: git diff --exit-code
