name: Weekly Model Retrain

# Schedule-only production wrapper. Keep this workflow disabled until the
# production environment, Railway token, and first manual dry run are approved.
on:
  schedule:
    - cron: '0 6 * * 2'

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-model-refit-production
  cancel-in-progress: false

jobs:
  refit:
    uses: ./.github/workflows/weekly-model-refit-core.yml
    with:
      activate_production: true
      force_refit: false
