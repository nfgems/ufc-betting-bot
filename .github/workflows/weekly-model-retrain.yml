name: Weekly Model Retrain

# Fail-closed manual dry-run wrapper. A production schedule and activation must
# be added only after the final confirmed package is explicitly authorized.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Required safety acknowledgement; production activation is disabled
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-model-refit-production
  cancel-in-progress: false

jobs:
  refit:
    if: inputs.dry_run == true
    uses: ./.github/workflows/weekly-model-refit-core.yml
    with:
      activate_production: false
      force_refit: false
