<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Bot — Predictions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090b10;
            --bg-elevated: #0f1219;
            --card: #151921;
            --card-hover: #1a1f2b;
            --border: #1e2433;
            --border-light: #2a3144;
            --text: #e8eaed;
            --text-secondary: #9aa0b0;
            --text-muted: #5c6270;
            --green: #00d68f;
            --green-dim: rgba(0, 214, 143, 0.12);
            --red: #ff5c5c;
            --red-dim: rgba(255, 92, 92, 0.12);
            --blue: #4d8ef7;
            --blue-dim: rgba(77, 142, 247, 0.12);
            --purple: #a78bfa;
            --purple-dim: rgba(167, 139, 250, 0.12);
            --yellow: #f5c542;
            --yellow-dim: rgba(245, 197, 66, 0.12);
            --orange: #fb923c;
            --orange-dim: rgba(251, 146, 60, 0.12);
            --accent: #4d8ef7;
            --radius: 12px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(9, 11, 16, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: 1360px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
        }

        .logo { display: flex; align-items: center; gap: 10px; }

        .logo-icon {
            width: 32px; height: 32px; border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px;
        }

        .logo h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
        .logo h1 span { color: var(--text-secondary); font-weight: 400; }

        .header-right { display: flex; align-items: center; gap: 10px; }

        .btn {
            padding: 7px 14px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--card);
            color: var(--text-secondary); font-size: 12px; font-weight: 500;
            cursor: pointer; transition: all 0.15s ease; font-family: inherit;
            text-decoration: none; display: inline-flex; align-items: center;
        }
        .btn:hover { background: var(--card-hover); border-color: var(--border-light); color: var(--text); }
        .btn-active { background: rgba(77,142,247,0.1); border-color: rgba(77,142,247,0.25); color: var(--blue); }

        .status-pill {
            display: flex; align-items: center; gap: 6px;
            padding: 5px 12px; border-radius: 20px;
            background: var(--card); border: 1px solid var(--border);
            font-size: 12px; color: var(--text-secondary);
        }
        .status-dot {
            width: 7px; height: 7px; border-radius: 50%; background: var(--green);
            animation: pulse 2.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,214,143,0.4); }
            50% { opacity: 0.6; box-shadow: 0 0 0 4px rgba(0,214,143,0); }
        }

        .container { max-width: 1360px; margin: 0 auto; padding: 20px 24px 40px; }

        .page-title {
            font-size: 20px; font-weight: 700; margin-bottom: 4px;
        }
        .page-subtitle {
            font-size: 13px; color: var(--text-muted); margin-bottom: 16px;
        }

        /* Toolbar */
        .toolbar {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .search-input {
            flex: 1; min-width: 180px; max-width: 320px;
            padding: 8px 12px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--card);
            color: var(--text); font-size: 13px; font-family: inherit;
            outline: none; transition: border-color 0.15s;
        }
        .search-input:focus { border-color: var(--accent); }
        .search-input::placeholder { color: var(--text-muted); }
        .sort-btn {
            padding: 7px 14px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--card);
            color: var(--text-secondary); font-size: 12px; font-weight: 500;
            cursor: pointer; transition: all 0.15s ease; font-family: inherit;
        }
        .sort-btn:hover { background: var(--card-hover); border-color: var(--border-light); color: var(--text); }
        .sort-btn.active { background: rgba(77,142,247,0.1); border-color: rgba(77,142,247,0.25); color: var(--blue); }
        .event-group-label {
            grid-column: 1 / -1;
            font-size: 13px; font-weight: 600; color: var(--text-secondary);
            padding: 8px 0 2px; border-bottom: 1px solid var(--border);
            margin-top: 8px;
        }
        .event-group-label:first-child { margin-top: 0; }

        /* Fight cards grid */
        .fight-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .fight-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color 0.15s ease;
        }
        .fight-card:hover { border-color: var(--border-light); }

        .fight-card-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 18px 12px;
            border-bottom: 1px solid var(--border);
        }
        .fight-matchup {
            font-size: 15px; font-weight: 600;
        }
        .fight-matchup .vs { color: var(--text-muted); font-weight: 400; margin: 0 6px; }
        .fight-date {
            font-size: 11px; color: var(--text-muted);
            padding: 3px 8px; border-radius: 4px;
            background: var(--bg-elevated); white-space: nowrap;
        }

        /* Winner prediction */
        .winner-row {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 18px;
            background: var(--bg-elevated);
        }
        .winner-label {
            font-size: 11px; font-weight: 500; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .winner-name {
            font-size: 14px; font-weight: 700; color: var(--green);
        }
        .winner-conf {
            font-size: 13px; font-weight: 600; color: var(--green);
            margin-left: auto;
        }

        /* Fight narrative */
        .fight-narrative {
            padding: 12px 18px;
            font-size: 12.5px;
            line-height: 1.65;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }

        /* Probability bars */
        .prob-section { padding: 14px 18px; }
        .prob-section-title {
            font-size: 11px; font-weight: 500; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;
        }
        .prob-row {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 8px;
        }
        .prob-bar-wrap {
            flex: 1; height: 22px; border-radius: 4px;
            background: var(--bg); display: flex; overflow: hidden;
            position: relative;
        }
        .prob-bar-a {
            height: 100%; transition: width 0.4s ease;
            display: flex; align-items: center; justify-content: flex-end;
            padding-right: 6px; font-size: 11px; font-weight: 600; color: #fff;
            min-width: 32px;
        }
        .prob-bar-b {
            height: 100%; transition: width 0.4s ease;
            display: flex; align-items: center; justify-content: flex-start;
            padding-left: 6px; font-size: 11px; font-weight: 600; color: #fff;
            min-width: 32px;
        }

        /* Feature highlights */
        .features-section {
            padding: 0 18px 14px;
        }
        .features-title {
            font-size: 11px; font-weight: 500; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
        }
        .features-grid {
            display: flex; flex-direction: column; gap: 5px;
        }
        .feature-item {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 10px; border-radius: 6px; font-size: 12px;
            background: var(--bg-elevated);
        }
        .feature-name {
            width: 140px; flex-shrink: 0;
            color: var(--text-secondary); font-weight: 500; font-size: 11px;
        }
        .feature-bar-wrap {
            flex: 1; display: flex; align-items: center; height: 18px;
            position: relative;
        }
        .feature-bar-center {
            position: absolute; left: 50%; top: 0; bottom: 0;
            width: 1px; background: var(--border-light);
        }
        .feature-bar {
            position: absolute; height: 14px; border-radius: 3px; top: 2px;
            min-width: 2px; transition: width 0.3s ease;
        }
        .feature-bar.bar-a { right: 50%; background: rgba(77,142,247,0.6); border-radius: 3px 0 0 3px; }
        .feature-bar.bar-b { left: 50%; background: rgba(167,139,250,0.6); border-radius: 0 3px 3px 0; }
        .feature-vals {
            width: 100px; flex-shrink: 0; text-align: right;
            display: flex; justify-content: flex-end; gap: 4px;
            font-weight: 600; font-size: 11px;
        }
        .fv-a { color: var(--blue); }
        .fv-b { color: var(--purple); }
        .fv-sep { color: var(--text-muted); }

        /* SHAP section */
        .shap-section { padding: 0 18px 16px; }
        .shap-details {
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .shap-details summary {
            padding: 10px 14px; font-size: 12px; font-weight: 500;
            color: var(--text-secondary); cursor: pointer;
            background: var(--bg-elevated);
            list-style: none;
        }
        .shap-details summary::-webkit-details-marker { display: none; }
        .shap-details summary::before {
            content: '\25B6'; margin-right: 8px; font-size: 10px;
            display: inline-block; transition: transform 0.2s;
        }
        .shap-details[open] summary::before { transform: rotate(90deg); }
        .shap-factors {
            padding: 14px; background: var(--card);
        }
        .shap-factors-header {
            display: flex; justify-content: space-between; margin-bottom: 10px;
            font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .shap-factors-header .sf-a { color: var(--blue); }
        .shap-factors-header .sf-b { color: var(--purple); }
        .shap-factor-row {
            display: flex; align-items: center; gap: 6px;
            padding: 5px 0; border-bottom: 1px solid rgba(30,36,51,0.4);
        }
        .shap-factor-row:last-child { border-bottom: none; }
        .sf-bar-left { width: 35%; display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
        .sf-label { width: 30%; text-align: center; font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sf-bar-right { width: 35%; display: flex; align-items: center; gap: 6px; }
        .sf-bar {
            height: 16px; border-radius: 3px; min-width: 2px;
            transition: width 0.3s ease;
        }
        .sf-bar.blue { background: rgba(77,142,247,0.7); }
        .sf-bar.red { background: rgba(168,85,247,0.7); }
        .sf-val { font-size: 10px; color: var(--text-muted); white-space: nowrap; }

        /* Empty state */
        .empty-state {
            text-align: center; padding: 60px 20px;
            color: var(--text-muted); font-size: 14px;
        }
        .empty-state-icon {
            font-size: 40px; margin-bottom: 12px; opacity: 0.4;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .fight-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .header-inner { padding: 10px 12px; }
            .feature-name { width: 110px; font-size: 10px; }
            .logo h1 span { display: none; }
            .btn { min-height: 40px; }
            .fight-matchup { font-size: 13px; }
        }
        @media (max-width: 480px) {
            .fight-card-header { flex-direction: column; align-items: flex-start; gap: 6px; }
            .header-right .btn-active { display: none; }
            .prob-bar-a, .prob-bar-b { font-size: 10px; min-width: 28px; }
            .winner-row { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">UB</div>
                <h1>UFC Bot <span>Predictions</span></h1>
            </div>
            <div class="header-right">
                <a href="/" class="btn">Dashboard</a>
                <a href="/predictions" class="btn btn-active">Predictions</a>
                <a href="/activity" class="btn">Activity</a>
                <div class="status-pill">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="lastUpdate">Connecting...</span>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="page-title">Fight Predictions</div>
        <div class="page-subtitle" id="predSubtitle">Loading predictions...</div>
        <div class="toolbar">
            <input type="text" class="search-input" id="searchInput" placeholder="Search fighter name...">
            <button class="sort-btn active" data-sort="confidence" onclick="setSort('confidence', this)">Confidence</button>
            <button class="sort-btn" data-sort="date" onclick="setSort('date', this)">Event Date</button>
            <button class="sort-btn" data-sort="name" onclick="setSort('name', this)">Name A-Z</button>
        </div>
        <div id="fightGrid" class="fight-grid"></div>
        <div id="emptyState" class="empty-state" style="display:none;">
            <div class="empty-state-icon">&#9878;</div>
            <div>No predictions available</div>
            <div style="font-size:12px;margin-top:6px;color:var(--text-muted);">
                Run <code style="color:var(--blue);">python -m src.bot live --dry-run</code> to generate predictions
            </div>
        </div>
    </div>

<script>
// (SHAP charts now use pure HTML, no Chart.js)
let currentSort = 'confidence';
let currentSearch = '';
let allPredictions = null;

function formatPct(v) { return (v * 100).toFixed(1) + '%'; }
function formatNum(v) {
    if (v === null || v === undefined) return '—';
    if (typeof v === 'number') return Math.abs(v) >= 100 ? Math.round(v).toString() : v.toFixed(2);
    return String(v);
}

function setSort(sort, el) {
    currentSort = sort;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    if (allPredictions) renderAll(allPredictions);
}

document.getElementById('searchInput').addEventListener('input', function() {
    currentSearch = this.value.toLowerCase().trim();
    if (allPredictions) renderAll(allPredictions);
});

function renderProbBar(container, p) {
    let aPct = (p.prob_a || 0.5) * 100;
    let bPct = (p.prob_b || 0.5) * 100;
    if (aPct < 5) { aPct = 5; bPct = 95; }
    else if (bPct < 5) { bPct = 5; aPct = 95; }

    let html = '<div class="prob-section">';
    html += `<div class="prob-section-title">Win Probability</div>`;
    html += `<div style="display:flex;justify-content:space-between;padding:0 0 6px 0;font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px">
        <span>${p.fighter_a}</span><span style="margin-left:auto">${p.fighter_b}</span></div>`;
    html += `<div class="prob-row">
        <div class="prob-bar-wrap">
            <div class="prob-bar-a" style="width:${aPct}%;background:#4d8ef7">${formatPct(p.prob_a || 0.5)}</div>
            <div class="prob-bar-b" style="width:${bPct}%;background:#a78bfa">${formatPct(p.prob_b || 0.5)}</div>
        </div>
    </div>`;
    html += '</div>';
    container.innerHTML += html;
}


function renderFeatureHighlights(container, highlights, fighterA, fighterB) {
    if (!highlights || highlights.length === 0) return;
    let html = '<div class="features-section"><div class="features-title">Stat Comparison</div>';
    html += `<div style="display:flex;align-items:center;gap:10px;padding:0 10px 8px">
        <span style="width:140px"></span>
        <div style="flex:1;display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px">
            <span style="color:var(--blue)">${fighterA}</span><span style="color:var(--purple)">${fighterB}</span>
        </div>
        <span style="width:100px"></span>
    </div>`;
    html += '<div class="features-grid">';
    for (const h of highlights) {
        const aVal = h.a_value != null ? Math.abs(h.a_value) : 0;
        const bVal = h.b_value != null ? Math.abs(h.b_value) : 0;
        const total = aVal + bVal || 1;
        // Bar width as % of half the container (max 48%)
        const aBarPct = Math.min(48, (aVal / total) * 48);
        const bBarPct = Math.min(48, (bVal / total) * 48);
        const aDisp = h.a_value != null ? formatNum(h.a_value) : '—';
        const bDisp = h.b_value != null ? formatNum(h.b_value) : '—';
        html += `<div class="feature-item">
            <span class="feature-name">${h.display_name}</span>
            <div class="feature-bar-wrap">
                <div class="feature-bar-center"></div>
                <div class="feature-bar bar-a" style="width:${aBarPct}%"></div>
                <div class="feature-bar bar-b" style="width:${bBarPct}%"></div>
            </div>
            <span class="feature-vals">
                <span class="fv-a">${aDisp}</span>
                <span class="fv-sep">vs</span>
                <span class="fv-b">${bDisp}</span>
            </span>
        </div>`;
    }
    html += '</div></div>';
    container.innerHTML += html;
}

function renderShapChart(container, shapValues, baseValue, fighterA, fighterB, cardId) {
    if (!shapValues || shapValues.length === 0) return;

    // Clean display names: strip "A "/"B " prefixes since we show fighter names in header
    function cleanLabel(name) {
        if (name.startsWith('A ') || name.startsWith('B ')) return name.slice(2);
        return name;
    }

    // Merge a_/b_ pairs into single rows showing net effect
    const merged = new Map();
    for (const s of shapValues) {
        const label = cleanLabel(s.display_name);
        if (merged.has(label)) {
            merged.get(label).value += s.value;
        } else {
            merged.set(label, { label, value: s.value });
        }
    }

    // Sort by absolute impact, take top 10
    const sorted = [...merged.values()].sort((a, b) => Math.abs(b.value) - Math.abs(a.value)).slice(0, 10);
    const maxAbs = Math.max(...sorted.map(s => Math.abs(s.value)), 0.01);

    let html = '<div class="shap-section"><details class="shap-details">';
    html += '<summary>Why this prediction?</summary>';
    html += '<div class="shap-factors">';
    html += `<div class="shap-factors-header"><span class="sf-a">${fighterA}</span><span style="color:var(--text-muted);font-weight:400">Key Factors</span><span class="sf-b">${fighterB}</span></div>`;

    for (const s of sorted) {
        const pct = Math.round((Math.abs(s.value) / maxAbs) * 100);
        const isA = s.value >= 0;
        html += `<div class="shap-factor-row">`;
        // Left side (fighter A bar)
        html += `<div class="sf-bar-left">`;
        if (isA) {
            html += `<span class="sf-val">${Math.abs(s.value).toFixed(2)}</span>`;
            html += `<div class="sf-bar blue" style="width:${pct}%"></div>`;
        }
        html += `</div>`;
        // Center label
        html += `<div class="sf-label" title="${s.label}">${s.label}</div>`;
        // Right side (fighter B bar)
        html += `<div class="sf-bar-right">`;
        if (!isA) {
            html += `<div class="sf-bar red" style="width:${pct}%"></div>`;
            html += `<span class="sf-val">${Math.abs(s.value).toFixed(2)}</span>`;
        }
        html += `</div>`;
        html += `</div>`;
    }

    html += '</div></details></div>';
    container.innerHTML += html;
}

function buildNarrative(p) {
    const winnerSide = p.prob_a >= p.prob_b ? 'a' : 'b';
    const winner = winnerSide === 'a' ? p.fighter_a : p.fighter_b;
    const loser = winnerSide === 'a' ? p.fighter_b : p.fighter_a;
    const conf = Math.max(p.prob_a, p.prob_b);
    const modelPct = (conf * 100).toFixed(0);

    // Confidence descriptor
    let confWord;
    if (conf >= 0.75) confWord = 'strongly favors';
    else if (conf >= 0.65) confWord = 'favors';
    else if (conf >= 0.55) confWord = 'gives a slight edge to';
    else confWord = 'sees this as a near coin-flip, slightly leaning toward';

    // Opening
    let text = `Our AI model ${confWord} <strong>${winner}</strong> with a ${modelPct}% chance of winning against ${loser}.`;

    // Top features
    const highlights = p.feature_highlights || [];
    if (highlights.length >= 2) {
        const top = highlights[0];
        const second = highlights[1];
        if (top.favors === 'a' || top.favors === 'b') {
            const favoredFighter = top.favors === 'a' ? p.fighter_a : p.fighter_b;
            text += ` The biggest factor is <strong>${top.display_name}</strong>, which gives ${favoredFighter} an advantage.`;
        }
        if (second.favors === 'a' || second.favors === 'b') {
            const favoredFighter2 = second.favors === 'a' ? p.fighter_a : p.fighter_b;
            text += ` <strong>${second.display_name}</strong> also favors ${favoredFighter2}.`;
        }
    } else if (highlights.length === 1 && (highlights[0].favors === 'a' || highlights[0].favors === 'b')) {
        const favoredFighter = highlights[0].favors === 'a' ? p.fighter_a : p.fighter_b;
        text += ` The biggest factor is <strong>${highlights[0].display_name}</strong>, which gives ${favoredFighter} an advantage.`;
    }

    // Method prediction based on fighter stats
    const ms = p.method_stats || {};
    const wKo = (winnerSide === 'a' ? ms.a_ko_rate : ms.b_ko_rate) || 0;
    const wSub = (winnerSide === 'a' ? ms.a_sub_rate : ms.b_sub_rate) || 0;
    const wDec = (winnerSide === 'a' ? ms.a_dec_rate : ms.b_dec_rate) || 0;
    const wSlpm = (winnerSide === 'a' ? ms.a_roll_slpm : ms.b_roll_slpm) || 0;
    const wKd = (winnerSide === 'a' ? ms.a_roll_kd : ms.b_roll_kd) || 0;
    const wSubAvg = (winnerSide === 'a' ? ms.a_roll_sub_avg : ms.b_roll_sub_avg) || 0;
    const wTdAvg = (winnerSide === 'a' ? ms.a_roll_td_avg : ms.b_roll_td_avg) || 0;
    if (wKo > 0 || wSub > 0 || wDec > 0) {
        // Determine most likely method
        let method, methodText;
        if (wKo >= wSub && wKo >= wDec) {
            method = 'ko';
            if (wKo >= 0.5) {
                methodText = `${winner} is a knockout artist — <strong>${(wKo * 100).toFixed(0)}% of their wins come by KO/TKO</strong>`;
            } else {
                methodText = `${winner} has solid knockout power with ${(wKo * 100).toFixed(0)}% of wins by KO/TKO`;
            }
            if (wSlpm > 5) methodText += `, landing ${wSlpm.toFixed(1)} significant strikes per minute`;
            if (wKd > 0.3) methodText += ` and averaging ${wKd.toFixed(1)} knockdowns per fight`;
            methodText += '.';
        } else if (wSub >= wKo && wSub >= wDec) {
            method = 'sub';
            methodText = `${winner} is a submission specialist — <strong>${(wSub * 100).toFixed(0)}% of their wins come by submission</strong>`;
            if (wSubAvg > 0.5) methodText += `, averaging ${wSubAvg.toFixed(1)} submission attempts per fight`;
            if (wTdAvg > 2) methodText += ` with ${wTdAvg.toFixed(1)} takedowns per fight to get the fight to the ground`;
            methodText += '.';
        } else {
            method = 'dec';
            methodText = `${winner} tends to win by <strong>decision</strong> (${(wDec * 100).toFixed(0)}% of wins), suggesting a methodical, grinding fight style`;
            if (wSlpm > 4) methodText += ` backed by ${wSlpm.toFixed(1)} strikes per minute`;
            methodText += '.';
        }

        text += ` ${methodText}`;

        // Round prediction
        if (method === 'ko' && wKo >= 0.4 && conf >= 0.6) {
            if (wKd > 0.5 && wSlpm > 5) {
                text += ` With that kind of volume and power, look for a stoppage in the <strong>first two rounds</strong>.`;
            } else {
                text += ` If the knockout comes, it could happen <strong>anywhere in the fight</strong> — ${winner} has shown the ability to finish at any point.`;
            }
        } else if (method === 'sub' && wSub >= 0.4 && conf >= 0.6) {
            if (wTdAvg > 3) {
                text += ` Expect ${winner} to look for the takedown early — a submission finish is most likely in <strong>rounds 1-2</strong>.`;
            } else {
                text += ` The submission could come <strong>later in the fight</strong> as ${loser} tires from defending grappling exchanges.`;
            }
        } else if (method === 'dec') {
            text += ` This one is likely to <strong>go the distance</strong>.`;
        }
    }

    // Experience warning
    if (p.low_experience) {
        text += ` <em>Note: One or both fighters have limited UFC history, so this prediction may be less reliable.</em>`;
    }

    return text;
}

function renderFightCard(pred, idx) {
    const card = document.createElement('div');
    card.className = 'fight-card';

    // Determine predicted winner
    const winner = pred.prob_a >= pred.prob_b ? pred.fighter_a : pred.fighter_b;
    const conf = pred.confidence;

    // Header
    const dateStr = pred.event_date ? new Date(pred.event_date).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '';
    card.innerHTML = `<div class="fight-card-header">
        <div class="fight-matchup">
            <span>${pred.fighter_a}</span>
            <span class="vs">vs</span>
            <span>${pred.fighter_b}</span>
        </div>
        <div class="fight-date">${dateStr}</div>
    </div>
    <div class="winner-row">
        <span class="winner-label">Predicted Winner</span>
        <span class="winner-name">${winner}</span>
        <span class="winner-conf">${formatPct(conf)}</span>
    </div>`;

    // Plain English narrative
    const narrative = document.createElement('div');
    narrative.className = 'fight-narrative';
    narrative.innerHTML = buildNarrative(pred);
    card.appendChild(narrative);

    renderProbBar(card, pred);
    renderFeatureHighlights(card, pred.feature_highlights, pred.fighter_a, pred.fighter_b);
    renderShapChart(card, pred.shap_values, pred.shap_base_value, pred.fighter_a, pred.fighter_b, idx);

    return card;
}

function renderAll(data) {
    allPredictions = data;
    const grid = document.getElementById('fightGrid');
    const empty = document.getElementById('emptyState');
    const subtitle = document.getElementById('predSubtitle');

    let preds = [...(data.predictions || [])];

    // Filter by search
    if (currentSearch) {
        preds = preds.filter(p =>
            p.fighter_a.toLowerCase().includes(currentSearch) ||
            p.fighter_b.toLowerCase().includes(currentSearch)
        );
    }

    if (preds.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        subtitle.textContent = currentSearch ? 'No matching fights' : 'No predictions available';
        return;
    }

    grid.style.display = '';
    empty.style.display = 'none';

    const total = (data.predictions || []).length;
    const ts = data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : '—';
    const showing = preds.length < total ? `Showing ${preds.length} of ${total}` : `${total} fights`;
    subtitle.textContent = `${showing} · Last updated: ${ts}`;

    // Sort
    if (currentSort === 'confidence') {
        preds.sort((a, b) => b.confidence - a.confidence);
    } else if (currentSort === 'date') {
        preds.sort((a, b) => {
            const da = a.event_date ? new Date(a.event_date) : new Date(0);
            const db = b.event_date ? new Date(b.event_date) : new Date(0);
            return da - db || b.confidence - a.confidence;
        });
    } else if (currentSort === 'name') {
        preds.sort((a, b) => a.fighter_a.localeCompare(b.fighter_a));
    }

    grid.innerHTML = '';

    // Group by event date when sorting by date
    let lastDate = null;
    preds.forEach((pred, idx) => {
        if (currentSort === 'date' && pred.event_date) {
            const dateKey = new Date(pred.event_date).toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
            if (dateKey !== lastDate) {
                lastDate = dateKey;
                const label = document.createElement('div');
                label.className = 'event-group-label';
                label.textContent = dateKey;
                grid.appendChild(label);
            }
        }
        grid.appendChild(renderFightCard(pred, idx));
    });
}

async function fetchPredictions() {
    try {
        const resp = await fetch('/api/predictions-detail');
        const data = await resp.json();
        renderAll(data);
        document.getElementById('statusDot').style.background = 'var(--green)';
        document.getElementById('lastUpdate').textContent = 'Live \u00B7 ' + new Date().toLocaleTimeString();
    } catch (e) {
        console.error('Failed to fetch predictions:', e);
        document.getElementById('statusDot').style.background = 'var(--red)';
        document.getElementById('lastUpdate').textContent = 'Connection error';
    }
}

// Initial load + auto-refresh
fetchPredictions();
setInterval(fetchPredictions, 30000);
</script>
