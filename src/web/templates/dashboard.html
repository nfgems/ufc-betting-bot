<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Betting Bot</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090b10;
            --bg-elevated: #0f1219;
            --card: #151921;
            --card-hover: #1a1f2b;
            --border: #1e2433;
            --border-light: #2a3144;
            --text: #e8eaed;
            --text-secondary: #9aa0b0;
            --text-muted: #5c6270;
            --green: #00d68f;
            --green-dim: rgba(0, 214, 143, 0.12);
            --red: #ff5c5c;
            --red-dim: rgba(255, 92, 92, 0.12);
            --blue: #4d8ef7;
            --blue-dim: rgba(77, 142, 247, 0.12);
            --purple: #a78bfa;
            --purple-dim: rgba(167, 139, 250, 0.12);
            --yellow: #f5c542;
            --yellow-dim: rgba(245, 197, 66, 0.12);
            --accent: #4d8ef7;
            --radius: 12px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(9, 11, 16, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: 1360px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .logo h1 {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .logo h1 span { color: var(--text-secondary); font-weight: 400; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0, 214, 143, 0.4); }
            50% { opacity: 0.6; box-shadow: 0 0 0 4px rgba(0, 214, 143, 0); }
        }

        .btn {
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .btn:hover {
            background: var(--card-hover);
            border-color: var(--border-light);
            color: var(--text);
        }

        .btn-accent {
            background: rgba(77, 142, 247, 0.1);
            border-color: rgba(77, 142, 247, 0.25);
            color: var(--blue);
        }

        .btn-accent:hover {
            background: rgba(77, 142, 247, 0.18);
        }

        /* Layout */
        .container {
            max-width: 1360px;
            margin: 0 auto;
            padding: 20px 24px 40px;
        }

        /* Stats Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            transition: border-color 0.15s ease;
        }

        .card:hover { border-color: var(--border-light); }

        .card-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .card-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .positive { color: var(--green); }
        .negative { color: var(--red); }
        .neutral  { color: var(--text); }

        /* Grid layout for chart + tables */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .grid-full {
            margin-bottom: 20px;
        }

        /* Sections */
        .section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
        }

        .section-header h2 {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: -0.1px;
        }

        /* Chart */
        .chart-container {
            position: relative;
            height: 240px;
            padding: 16px 18px 12px;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .badge-open { background: var(--blue-dim); color: var(--blue); }
        .badge-won  { background: var(--green-dim); color: var(--green); }
        .badge-lost { background: var(--red-dim); color: var(--red); }
        .badge-dry  { background: var(--purple-dim); color: var(--purple); }

        /* Tables */
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 580px;
        }

        thead th {
            text-align: left;
            padding: 9px 16px;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        thead th.right, td.right { text-align: right; }

        tbody td {
            padding: 11px 16px;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tbody tr:last-child td { border-bottom: none; }

        tbody tr {
            transition: background 0.1s ease;
        }

        tbody tr:hover { background: rgba(255, 255, 255, 0.015); }

        .fighter-cell {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .fighter-name { font-weight: 500; font-size: 13px; }
        .opponent-name { font-size: 11px; color: var(--text-muted); }

        /* Settle buttons */
        .settle-btns { display: flex; gap: 4px; justify-content: flex-end; }

        .settle-btn {
            padding: 4px 10px;
            border-radius: 5px;
            border: 1px solid transparent;
            background: transparent;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.12s ease;
        }

        .settle-btn.win {
            color: var(--green);
            background: var(--green-dim);
        }
        .settle-btn.win:hover { background: rgba(0, 214, 143, 0.22); }

        .settle-btn.lose {
            color: var(--red);
            background: var(--red-dim);
        }
        .settle-btn.lose:hover { background: rgba(255, 92, 92, 0.22); }

        .empty-state {
            padding: 48px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        .empty-state .empty-icon {
            font-size: 28px;
            margin-bottom: 8px;
            opacity: 0.4;
        }

        /* Tabs */
        .tabs { display: flex; gap: 2px; background: var(--bg); border-radius: 7px; padding: 2px; }

        .tab {
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            transition: all 0.12s ease;
        }

        .tab.active {
            background: var(--card-hover);
            color: var(--text);
        }

        .tab:hover:not(.active) { color: var(--text-secondary); }

        /* Responsive */
        @media (max-width: 1100px) {
            .cards { grid-template-columns: repeat(3, 1fr); }
            .grid-2 { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .container { padding: 12px; }
            .header-inner { padding: 10px 12px; }
            .cards { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .card { padding: 14px; }
            .card-value { font-size: 20px; }
            .logo h1 span { display: none; }
            .btn { padding: 6px 10px; font-size: 11px; }
            .chart-container { height: 180px; }
        }

        @media (max-width: 480px) {
            .cards { grid-template-columns: 1fr 1fr; }
            .header-right .btn:not(:last-child) { display: none; }
        }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, var(--card) 25%, var(--card-hover) 50%, var(--card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            background: var(--card);
            border: 1px solid var(--border-light);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">UB</div>
                <h1>UFC Bot <span>Dashboard</span></h1>
            </div>
            <div class="header-right">
                <div class="status-pill">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="lastUpdate">Connecting...</span>
                </div>
                <button class="btn" onclick="refreshPrices()">Refresh Prices</button>
                <button class="btn btn-accent" onclick="autoSettle()">Auto-Settle</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="cards" id="cards">
            <div class="card"><div class="skeleton" style="height:60px"></div></div>
            <div class="card"><div class="skeleton" style="height:60px"></div></div>
            <div class="card"><div class="skeleton" style="height:60px"></div></div>
            <div class="card"><div class="skeleton" style="height:60px"></div></div>
            <div class="card"><div class="skeleton" style="height:60px"></div></div>
            <div class="card"><div class="skeleton" style="height:60px"></div></div>
        </div>

        <div class="grid-full">
            <div class="section">
                <div class="section-header">
                    <h2>P&L Over Time</h2>
                </div>
                <div class="chart-container">
                    <canvas id="pnlChart"></canvas>
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="section">
                <div class="section-header">
                    <h2>Open Positions</h2>
                    <span class="badge badge-open" id="openCount">0</span>
                </div>
                <div class="table-wrap" id="openTable">
                    <div class="empty-state"><div class="empty-icon">--</div>No open positions</div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <h2>Bet History</h2>
                    <div class="tabs">
                        <button class="tab active" onclick="setHistoryFilter('all', this)">All</button>
                        <button class="tab" onclick="setHistoryFilter('won', this)">Won</button>
                        <button class="tab" onclick="setHistoryFilter('lost', this)">Lost</button>
                    </div>
                </div>
                <div class="table-wrap" id="historyTable">
                    <div class="empty-state"><div class="empty-icon">--</div>No settled bets yet</div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let pnlChart = null;
        let historyFilter = 'all';
        let allBets = [];

        function pnlClass(v) { return v > 0 ? 'positive' : v < 0 ? 'negative' : 'neutral'; }
        function fmtPnl(v) { return v == null ? '--' : `${v >= 0 ? '+' : '-'}$${Math.abs(v).toFixed(2)}`; }
        function fmtPct(v) { return v == null ? '--' : `${(v * 100).toFixed(1)}%`; }
        function fmtEdge(v) { return v == null ? '--' : `${v >= 0 ? '+' : ''}${(v * 100).toFixed(1)}%`; }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function renderCards(s) {
            document.getElementById('cards').innerHTML = `
                <div class="card">
                    <div class="card-label">Total P&L</div>
                    <div class="card-value ${pnlClass(s.total_pnl)}">${fmtPnl(s.total_pnl)}</div>
                    <div class="card-sub">${fmtPct(s.roi)} ROI</div>
                </div>
                <div class="card">
                    <div class="card-label">Realized</div>
                    <div class="card-value ${pnlClass(s.realized_pnl)}">${fmtPnl(s.realized_pnl)}</div>
                    <div class="card-sub">${s.settled_bets} settled</div>
                </div>
                <div class="card">
                    <div class="card-label">Unrealized</div>
                    <div class="card-value ${pnlClass(s.unrealized_pnl)}">${fmtPnl(s.unrealized_pnl)}</div>
                    <div class="card-sub">${s.open_bets} open</div>
                </div>
                <div class="card">
                    <div class="card-label">Win Rate</div>
                    <div class="card-value">${fmtPct(s.win_rate)}</div>
                    <div class="card-sub">${s.wins}W &middot; ${s.losses}L</div>
                </div>
                <div class="card">
                    <div class="card-label">Total Wagered</div>
                    <div class="card-value">$${s.total_wagered.toFixed(2)}</div>
                    <div class="card-sub">${s.total_bets} bets</div>
                </div>
                <div class="card">
                    <div class="card-label">Open Exposure</div>
                    <div class="card-value">$${s.open_invested.toFixed(2)}</div>
                    <div class="card-sub">${s.open_bets} active</div>
                </div>`;
        }

        function renderOpenTable(bets) {
            const el = document.getElementById('openTable');
            document.getElementById('openCount').textContent = bets.length;

            if (!bets.length) {
                el.innerHTML = '<div class="empty-state"><div class="empty-icon">--</div>No open positions</div>';
                return;
            }

            const rows = bets.map(b => {
                const cur = b.cur_price != null ? `$${b.cur_price.toFixed(4)}` : '--';
                let pnl = '--', cls = 'neutral';
                if (b.cur_price != null) {
                    const v = b.shares * b.cur_price - b.amount;
                    pnl = fmtPnl(v);
                    cls = pnlClass(v);
                }
                const dry = b.dry_run ? ' <span class="badge badge-dry">DRY</span>' : '';

                return `<tr>
                    <td><div class="fighter-cell"><span class="fighter-name">${b.fighter}${dry}</span><span class="opponent-name">vs ${b.opponent}</span></div></td>
                    <td class="right">$${b.amount.toFixed(2)}</td>
                    <td class="right">$${b.price.toFixed(4)}</td>
                    <td class="right">${cur}</td>
                    <td class="right ${cls}">${pnl}</td>
                    <td class="right">${fmtEdge(b.edge)}</td>
                    <td class="right"><div class="settle-btns">
                        <button class="settle-btn win" onclick="settleBet(${b.id},'win')">Win</button>
                        <button class="settle-btn lose" onclick="settleBet(${b.id},'loss')">Loss</button>
                    </div></td>
                </tr>`;
            }).join('');

            el.innerHTML = `<table>
                <thead><tr><th>Fighter</th><th class="right">Amount</th><th class="right">Entry</th><th class="right">Current</th><th class="right">P&L</th><th class="right">Edge</th><th class="right">Settle</th></tr></thead>
                <tbody>${rows}</tbody></table>`;
        }

        function renderHistoryTable(bets) {
            const el = document.getElementById('historyTable');
            let filtered = bets.filter(b => b.status === 'won' || b.status === 'lost');
            if (historyFilter !== 'all') filtered = filtered.filter(b => b.status === historyFilter);
            filtered = filtered.slice().reverse().slice(0, 50);

            if (!filtered.length) {
                el.innerHTML = '<div class="empty-state"><div class="empty-icon">--</div>No settled bets yet</div>';
                return;
            }

            const rows = filtered.map(b => {
                const cls = b.status === 'won' ? 'positive' : 'negative';
                const badge = b.status === 'won' ? 'badge-won' : 'badge-lost';
                const dry = b.dry_run ? ' <span class="badge badge-dry">DRY</span>' : '';
                const date = b.settled_at ? new Date(b.settled_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '--';

                return `<tr>
                    <td><div class="fighter-cell"><span class="fighter-name">${b.fighter}${dry}</span><span class="opponent-name">vs ${b.opponent}</span></div></td>
                    <td class="right">$${b.amount.toFixed(2)}</td>
                    <td class="right"><span class="badge ${badge}">${b.status.toUpperCase()}</span></td>
                    <td class="right ${cls}">${fmtPnl(b.result_pnl)}</td>
                    <td class="right" style="color:var(--text-muted)">${date}</td>
                </tr>`;
            }).join('');

            el.innerHTML = `<table>
                <thead><tr><th>Fighter</th><th class="right">Amount</th><th class="right">Result</th><th class="right">P&L</th><th class="right">Date</th></tr></thead>
                <tbody>${rows}</tbody></table>`;
        }

        function renderChart(history) {
            const ctx = document.getElementById('pnlChart').getContext('2d');
            const labels = history.map(h => {
                const d = new Date(h.timestamp);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
                    + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            });
            const values = history.map(h => h.total_pnl || 0);

            if (pnlChart) {
                pnlChart.data.labels = labels;
                pnlChart.data.datasets[0].data = values;
                pnlChart.update('none');
                return;
            }

            const last = values[values.length - 1] || 0;
            const color = last >= 0 ? '#00d68f' : '#ff5c5c';
            const gradient = ctx.createLinearGradient(0, 0, 0, 240);
            gradient.addColorStop(0, last >= 0 ? 'rgba(0, 214, 143, 0.18)' : 'rgba(255, 92, 92, 0.18)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            pnlChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        data: values,
                        borderColor: color,
                        backgroundColor: gradient,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.35,
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        pointHoverBackgroundColor: color,
                        pointHoverBorderColor: '#fff',
                        pointHoverBorderWidth: 2,
                        pointHitRadius: 20,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { intersect: false, mode: 'index' },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(21, 25, 33, 0.95)',
                            borderColor: 'rgba(42, 49, 68, 0.6)',
                            borderWidth: 1,
                            cornerRadius: 8,
                            padding: 10,
                            titleColor: '#9aa0b0',
                            titleFont: { size: 11 },
                            bodyColor: '#e8eaed',
                            bodyFont: { size: 13, weight: '600' },
                            displayColors: false,
                            callbacks: {
                                label: c => `P&L: ${c.parsed.y >= 0 ? '+' : ''}$${c.parsed.y.toFixed(2)}`
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#5c6270', maxTicksLimit: 6, font: { size: 10 } },
                            grid: { color: 'rgba(30, 36, 51, 0.6)', drawBorder: false },
                            border: { display: false },
                        },
                        y: {
                            ticks: { color: '#5c6270', font: { size: 10 }, callback: v => `$${v}` },
                            grid: { color: 'rgba(30, 36, 51, 0.6)', drawBorder: false },
                            border: { display: false },
                        }
                    }
                }
            });
        }

        async function refreshPrices() {
            const r = await fetch('/api/refresh-prices', { method: 'POST' });
            const d = await r.json();
            if (d.status === 'offline') showToast('Offline mode — no live prices');
            else { showToast(`Updated ${d.updated} price(s)`); await fetchAll(); }
        }

        async function autoSettle() {
            const r = await fetch('/api/settle-auto', { method: 'POST' });
            const d = await r.json();
            showToast(`Auto-settled ${d.settled} bet(s)`);
            await fetchAll();
        }

        async function settleBet(id, result) {
            if (!confirm(`Settle bet #${id} as ${result.toUpperCase()}?`)) return;
            await fetch(`/api/settle/${id}/${result}`, { method: 'POST' });
            showToast(`Bet #${id} settled as ${result}`);
            await fetchAll();
        }

        function setHistoryFilter(f, el) {
            historyFilter = f;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderHistoryTable(allBets);
        }

        async function fetchAll() {
            try {
                const [sR, bR, hR] = await Promise.all([
                    fetch('/api/summary'), fetch('/api/bets'), fetch('/api/pnl-history')
                ]);
                const summary = await sR.json();
                const bets = await bR.json();
                const history = await hR.json();

                allBets = bets.all || [];
                renderCards(summary);
                renderOpenTable(bets.open || []);
                renderHistoryTable(allBets);
                if (history.length > 1) renderChart(history);

                document.getElementById('lastUpdate').textContent = 'Updated ' + new Date().toLocaleTimeString();
                document.getElementById('statusDot').style.background = 'var(--green)';
            } catch (e) {
                console.error(e);
                document.getElementById('statusDot').style.background = 'var(--red)';
                document.getElementById('lastUpdate').textContent = 'Connection error';
            }
        }

        fetchAll();
        setInterval(fetchAll, 30000);
    </script>
</body>
</html>
