<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC - Execution Breakdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#050505; --panel:#111; --panel2:#171717; --line:#2a2a2a; --line2:#3e3e3e;
            --text:#f5f0e8; --muted:#b8a99a; --dim:#756a64; --red:#d20a0a; --red2:#ff3b3b;
            --gold:#c9a84c; --green:#00d68f; --blue:#69a8ff; --orange:#ff9b52; --purple:#9b8cff;
            --body:'Manrope',sans-serif; --head:'Oswald',sans-serif;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body {
            min-height:100vh; color:var(--text); font-family:var(--body);
            background:
                radial-gradient(ellipse at 18% 0%, rgba(210,10,10,.16), transparent 42%),
                radial-gradient(ellipse at 82% 0%, rgba(201,168,76,.08), transparent 34%),
                linear-gradient(180deg,#050505 0%,#090909 48%,#050505 100%);
            -webkit-font-smoothing:antialiased;
        }
        body::after { content:''; position:fixed; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,var(--red),var(--gold),var(--red),transparent); z-index:99; pointer-events:none; }
        .header { position:sticky; top:3px; z-index:50; background:rgba(5,5,5,.9); border-bottom:1px solid rgba(210,10,10,.25); backdrop-filter:blur(16px); }
        .header-inner, .container { max-width:1480px; margin:0 auto; padding-left:24px; padding-right:24px; }
        .header-inner { min-height:66px; display:flex; justify-content:space-between; align-items:center; gap:16px; }
        .logo, .nav { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .logo-icon { width:36px; height:36px; clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%); background:linear-gradient(135deg,var(--red),#8b0000,var(--gold)); display:grid; place-items:center; font:700 12px var(--head); letter-spacing:1px; }
        .logo h1 { font:700 20px var(--head); letter-spacing:2px; text-transform:uppercase; }
        .logo h1 span { color:var(--gold); font-weight:500; }
        .btn, .select, .search {
            border:1px solid var(--line); border-radius:8px; background:rgba(19,19,19,.95); color:var(--muted);
            font:700 12px var(--body); padding:8px 12px; text-decoration:none;
        }
        .btn { cursor:pointer; display:inline-flex; align-items:center; justify-content:center; min-height:34px; }
        .btn:hover, .btn.active { color:var(--text); border-color:rgba(210,10,10,.45); background:rgba(210,10,10,.16); }
        .container { padding-top:22px; padding-bottom:44px; }
        .topbar { display:grid; grid-template-columns:1fr auto; gap:16px; align-items:end; margin-bottom:16px; }
        .title h2 { font:700 34px var(--head); letter-spacing:0; line-height:1; margin-bottom:8px; }
        .meta { color:var(--muted); font-size:13px; line-height:1.5; }
        .controls { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
        .select, .search { min-height:38px; outline:none; }
        .search { min-width:260px; font-weight:600; }
        .summary-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin-bottom:16px; }
        .summary { border:1px solid rgba(210,10,10,.16); background:rgba(17,17,17,.78); border-left:3px solid var(--red); border-radius:8px; padding:13px; min-height:84px; }
        .summary .k { color:var(--dim); font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px; }
        .summary .v { font:700 24px var(--head); }
        .summary .s { color:var(--muted); font-size:12px; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .fight-list { display:grid; gap:12px; }
        .fight { border:1px solid rgba(210,10,10,.18); background:linear-gradient(180deg,rgba(18,18,18,.95),rgba(8,8,8,.95)); border-radius:8px; overflow:hidden; }
        .fight summary { list-style:none; cursor:pointer; padding:16px 18px; display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center; border-bottom:1px solid rgba(255,255,255,.06); }
        .fight summary::-webkit-details-marker { display:none; }
        .matchup { font:700 22px var(--head); letter-spacing:0; line-height:1.05; }
        .fight-sub { color:var(--muted); font-size:12px; margin-top:7px; display:flex; gap:10px; flex-wrap:wrap; }
        .status-strip { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
        .mini { border:1px solid var(--line); background:rgba(5,5,5,.65); border-radius:999px; padding:5px 8px; font-size:11px; color:var(--muted); font-weight:800; }
        .path-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; border-top:1px solid rgba(255,255,255,.04); }
        .path { min-width:0; padding:15px; border-right:1px solid rgba(255,255,255,.07); display:grid; gap:11px; align-content:start; }
        .path:last-child { border-right:none; }
        .path-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; min-height:42px; }
        .path-title { font-weight:800; font-size:13px; line-height:1.25; }
        .badge { display:inline-flex; align-items:center; justify-content:center; border-radius:999px; padding:5px 8px; font-size:10px; font-weight:900; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; border:1px solid transparent; }
        .st-bet_placed, .st-dry_run { color:var(--green); background:rgba(0,214,143,.12); border-color:rgba(0,214,143,.25); }
        .st-skipped, .st-no_market_match, .st-outside_window, .st-not_evaluated { color:var(--muted); background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.09); }
        .st-blocked { color:var(--orange); background:rgba(255,155,82,.12); border-color:rgba(255,155,82,.25); }
        .st-order_failed, .st-order_unknown { color:var(--red2); background:rgba(210,10,10,.14); border-color:rgba(210,10,10,.3); }
        .st-candidate, .st-operator_pass { color:var(--blue); background:rgba(105,168,255,.12); border-color:rgba(105,168,255,.25); }
        .gate { color:var(--gold); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; overflow-wrap:anywhere; }
        .explanation { color:var(--text); font-size:13px; line-height:1.5; overflow-wrap:anywhere; }
        .numbers { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
        .num { border:1px solid rgba(255,255,255,.07); background:rgba(5,5,5,.42); border-radius:6px; padding:8px; min-width:0; }
        .num .k { color:var(--dim); font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; }
        .num .v { color:var(--text); font-size:12px; font-weight:800; overflow-wrap:anywhere; }
        .order { border:1px solid rgba(0,214,143,.18); background:rgba(0,214,143,.06); border-radius:6px; padding:9px; display:grid; gap:5px; }
        .order-row { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:12px; }
        .order-row strong { color:var(--text); overflow-wrap:anywhere; text-align:right; }
        details.stage-wrap { border:1px solid rgba(255,255,255,.07); border-radius:6px; overflow:hidden; }
        .stage-wrap summary { display:block; padding:8px 10px; border:0; background:rgba(255,255,255,.04); font-size:11px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
        .stage-list { display:grid; gap:8px; padding:10px; }
        .stage { border-left:2px solid var(--line2); padding-left:8px; color:var(--muted); font-size:12px; line-height:1.45; }
        .stage strong { color:var(--text); }
        .empty { border:1px dashed rgba(255,255,255,.16); border-radius:8px; background:rgba(17,17,17,.65); padding:42px 20px; text-align:center; color:var(--muted); }
        .hidden { display:none; }
        @media (max-width:1200px) { .path-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .path:nth-child(2) { border-right:none; } .path:nth-child(1), .path:nth-child(2) { border-bottom:1px solid rgba(255,255,255,.07); } .summary-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
        @media (max-width:820px) { .header-inner, .topbar, .fight summary { align-items:flex-start; } .header-inner, .topbar, .fight summary { grid-template-columns:1fr; } .header-inner { display:grid; } .nav, .controls, .status-strip { justify-content:flex-start; } .path-grid { grid-template-columns:1fr; } .path { border-right:none; border-bottom:1px solid rgba(255,255,255,.07); } .path:last-child { border-bottom:none; } .summary-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .search, .select, .btn { width:100%; } }
        @media (max-width:520px) { .header-inner, .container { padding-left:12px; padding-right:12px; } .summary-grid, .numbers { grid-template-columns:1fr; } .matchup { font-size:19px; } .title h2 { font-size:28px; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo"><div class="logo-icon">UFC</div><h1>UFC <span>Execution</span></h1></div>
            <nav class="nav">
                <a href="/" class="btn">Dashboard</a>
                <a href="/bet-history" class="btn">Bet History</a>
                <a href="/predictions" class="btn">Predictions</a>
                <a href="/activity" class="btn">Activity</a>
                <a href="/operator" class="btn">Operator</a>
                <a href="/reasoning" class="btn">Reasoning</a>
                <a href="/execution-breakdown" class="btn active">Execution</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="topbar">
            <div class="title">
                <h2>Execution Breakdown</h2>
                <div class="meta" id="cycleMeta">Loading latest runtime cycle...</div>
            </div>
            <div class="controls">
                <input class="search" id="searchInput" type="search" placeholder="Search fighter or gate">
                <select class="select" id="cycleSelect"><option value="">Latest cycle</option></select>
                <button class="btn" id="refreshBtn" type="button">Refresh</button>
            </div>
        </section>

        <section class="summary-grid" id="summaryGrid"></section>
        <section class="fight-list" id="fightList"></section>
        <section class="empty hidden" id="emptyState">No execution audit has been written yet.</section>
    </main>

    <script>
        const PATHS = ['S', 'C', 'M', 'G'];
        const PATH_LABELS = { S: 'Single Trader', C: 'Conviction', M: 'Model Tracker', G: 'Gemini Tracker' };
        let loadedCycles = [];
        let activeCycle = null;
        let searchText = '';

        const els = {
            meta: document.getElementById('cycleMeta'),
            summary: document.getElementById('summaryGrid'),
            list: document.getElementById('fightList'),
            empty: document.getElementById('emptyState'),
            cycleSelect: document.getElementById('cycleSelect'),
            search: document.getElementById('searchInput'),
            refresh: document.getElementById('refreshBtn'),
        };

        function esc(value) {
            const div = document.createElement('div');
            div.textContent = value == null ? '' : String(value);
            return div.innerHTML;
        }

        function fmtDate(value) {
            if (!value) return 'Unknown time';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return String(value);
            return date.toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
        }

        function fmtPct(value, signed=false) {
            const n = Number(value);
            if (!Number.isFinite(n)) return 'N/A';
            const sign = signed && n > 0 ? '+' : '';
            return `${sign}${(n * 100).toFixed(1)}%`;
        }

        function fmtMoney(value) {
            const n = Number(value);
            return Number.isFinite(n) ? `$${n.toFixed(2)}` : 'N/A';
        }

        function fmtNum(value, digits=4) {
            const n = Number(value);
            if (!Number.isFinite(n)) return value == null || value === '' ? 'N/A' : String(value);
            return n.toFixed(digits).replace(/\.?0+$/, '');
        }

        function statusLabel(status) {
            return String(status || 'unknown').replace(/_/g, ' ');
        }

        function statusClass(status) {
            return `st-${String(status || 'unknown').replace(/[^a-z0-9_]/gi, '_')}`;
        }

        function firstValue(...values) {
            for (const value of values) {
                if (value !== undefined && value !== null && value !== '') return value;
            }
            return null;
        }

        function numberRows(numbers) {
            const rows = [
                ['Pick', numbers.bet_on],
                ['Model', fmtPct(numbers.model_probability)],
                ['No-odds', fmtPct(numbers.no_odds_probability)],
                ['Market', fmtPct(numbers.market_probability)],
                ['Blended', fmtPct(numbers.blended_probability)],
                ['Edge', fmtPct(numbers.edge, true)],
                ['Required', fmtPct(firstValue(numbers.required_edge, numbers.minimum_edge), true)],
                ['No-odds edge', fmtPct(numbers.no_odds_edge, true)],
                ['UFC fights', `${firstValue(numbers.a_ufc_fights, 'N/A')} / ${firstValue(numbers.b_ufc_fights, 'N/A')}`],
                ['Min fights', numbers.min_fight_threshold],
                ['Window', numbers.bet_window ? `${numbers.bet_window.state || ''} ${numbers.bet_window.open ? 'open' : 'closed'}` : 'N/A'],
                ['Market ID', numbers.market_id],
                ['Token ID', numbers.token_id],
                ['Ledger ID', firstValue(numbers.ledger_id, numbers.existing_ledger_id)],
                ['Order ID', firstValue(numbers.order_id, numbers.existing_order_id)],
            ];
            return rows
                .filter(([, value]) => value !== undefined && value !== null && value !== '' && value !== 'N/A / N/A')
                .map(([key, value]) => `<div class="num"><div class="k">${esc(key)}</div><div class="v">${esc(value)}</div></div>`)
                .join('');
        }

        function orderBlock(order) {
            if (!order || !Object.keys(order).length) return '';
            const matched = order.matched === true ? 'yes' : order.matched === false ? 'no' : firstValue(order.placement_state, 'unknown');
            const rows = [
                ['Amount', fmtMoney(firstValue(order.amount, order.submitted_amount, order.requested_amount))],
                ['Price', fmtNum(order.price, 4)],
                ['Type', order.order_type],
                ['Ledger', order.ledger_id],
                ['Order', order.order_id],
                ['Matched', matched],
                ['Error', order.error],
            ].filter(([, value]) => value !== undefined && value !== null && value !== '' && value !== 'N/A');
            if (!rows.length) return '';
            return `<div class="order">${rows.map(([k, v]) => `<div class="order-row"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div>`;
        }

        function stagesBlock(stages) {
            if (!Array.isArray(stages) || !stages.length) return '';
            return `
                <details class="stage-wrap">
                    <summary>Decision stages</summary>
                    <div class="stage-list">
                        ${stages.map(stage => `
                            <div class="stage">
                                <strong>${esc(stage.stage || stage.gate || 'stage')}</strong>
                                ${esc(statusLabel(stage.status))} at ${esc(stage.gate || '')}<br>
                                ${esc(stage.explanation || '')}
                            </div>
                        `).join('')}
                    </div>
                </details>
            `;
        }

        function pathPanel(pathKey, path) {
            const numbers = path.numbers || {};
            return `
                <article class="path">
                    <div class="path-head">
                        <div class="path-title">${esc(path.label || PATH_LABELS[pathKey] || pathKey)}</div>
                        <span class="badge ${statusClass(path.status)}">${esc(statusLabel(path.status))}</span>
                    </div>
                    <div class="gate">${esc(path.gate || '')}</div>
                    <div class="explanation">${esc(path.explanation || '')}</div>
                    ${orderBlock(path.order || {})}
                    <div class="numbers">${numberRows(numbers)}</div>
                    ${stagesBlock(path.stages)}
                </article>
            `;
        }

        function fightMatches(fight) {
            if (!searchText) return true;
            const haystack = [
                fight.fighter_a, fight.fighter_b, fight.event_title, fight.weight_class,
                ...PATHS.flatMap(path => {
                    const item = fight.paths?.[path] || {};
                    return [item.status, item.gate, item.explanation, item.numbers?.bet_on];
                })
            ].join(' ').toLowerCase();
            return haystack.includes(searchText);
        }

        function fightSection(fight, index) {
            const paths = fight.paths || {};
            const chips = PATHS.map(path => {
                const item = paths[path] || {};
                return `<span class="mini">${path}: ${esc(statusLabel(item.status))}</span>`;
            }).join('');
            return `
                <details class="fight" ${index < 4 ? 'open' : ''}>
                    <summary>
                        <div>
                            <div class="matchup">${esc(fight.fighter_a || '?')} vs ${esc(fight.fighter_b || '?')}</div>
                            <div class="fight-sub">
                                <span>${esc(fight.weight_class || 'UFC')}</span>
                                <span>${esc(fight.event_title || '')}</span>
                                <span>${esc(fmtDate(fight.market_event_date || fight.event_date))}</span>
                            </div>
                        </div>
                        <div class="status-strip">${chips}</div>
                    </summary>
                    <div class="path-grid">
                        ${PATHS.map(path => pathPanel(path, paths[path] || { label: PATH_LABELS[path], status: 'not_evaluated', gate: 'not_evaluated', explanation: 'No decision recorded.', numbers: {}, stages: [] })).join('')}
                    </div>
                </details>
            `;
        }

        function summaryCards(cycle, fights) {
            const counts = cycle?.path_counts || {};
            const placed = PATHS.reduce((sum, path) => sum + Number(counts[path]?.bet_placed || 0) + Number(counts[path]?.dry_run || 0), 0);
            const blocked = PATHS.reduce((sum, path) => sum + Number(counts[path]?.blocked || 0), 0);
            const skipped = PATHS.reduce((sum, path) => {
                const item = counts[path] || {};
                return sum + Number(item.skipped || 0) + Number(item.outside_window || 0) + Number(item.no_market_match || 0);
            }, 0);
            return [
                ['Cycle', cycle?.cycle_id || 'None', cycle?.completed_at ? fmtDate(cycle.completed_at) : 'No completed cycle'],
                ['Fights', fights.length, cycle?.event_title || 'Latest runtime cycle'],
                ['Orders', placed, 'Placed or dry-run order results'],
                ['Blocked', blocked, 'Operator, stop-loss, or same-fight blocks'],
                ['Skipped', skipped, 'Strategy, market, window, duplicate, or executor skips'],
            ].map(([k, v, s]) => `<div class="summary"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s)}</div></div>`).join('');
        }

        function render() {
            const cycle = activeCycle;
            const fights = (cycle?.fights || []).filter(fightMatches);
            els.meta.textContent = cycle
                ? `Cycle ${cycle.cycle_id} completed ${fmtDate(cycle.completed_at)}. ${cycle.dry_run ? 'Dry run' : 'Live mode'}`
                : 'No execution audit has been written yet.';
            els.summary.innerHTML = summaryCards(cycle, fights);
            els.list.innerHTML = fights.map(fightSection).join('');
            els.empty.classList.toggle('hidden', fights.length > 0);
            if (!cycle) els.empty.textContent = 'No execution audit has been written yet.';
            else if (!fights.length) els.empty.textContent = 'No fights match the current search.';
        }

        function populateCycles(cycles) {
            const previous = els.cycleSelect.value;
            els.cycleSelect.innerHTML = cycles.map((cycle, index) => {
                const label = `${index === 0 ? 'Latest: ' : ''}${cycle.cycle_id || 'cycle'} (${fmtDate(cycle.completed_at || cycle.started_at)})`;
                return `<option value="${esc(cycle.cycle_id || '')}">${esc(label)}</option>`;
            }).join('');
            if (previous && cycles.some(cycle => cycle.cycle_id === previous)) {
                els.cycleSelect.value = previous;
            }
        }

        async function loadData({ history=false } = {}) {
            els.refresh.disabled = true;
            try {
                const response = await fetch(`/api/execution-breakdown${history ? '?history=1&limit=50' : ''}`, { cache: 'no-store' });
                const payload = await response.json();
                loadedCycles = (payload.cycles || []).filter(Boolean);
                if (history) populateCycles(loadedCycles);
                const selectedId = els.cycleSelect.value;
                activeCycle = selectedId
                    ? loadedCycles.find(cycle => cycle.cycle_id === selectedId) || payload.cycle
                    : payload.cycle;
                render();
            } catch (error) {
                activeCycle = null;
                els.meta.textContent = `Failed to load execution audit: ${error}`;
                render();
            } finally {
                els.refresh.disabled = false;
            }
        }

        els.search.addEventListener('input', event => {
            searchText = String(event.target.value || '').trim().toLowerCase();
            render();
        });
        els.refresh.addEventListener('click', () => loadData({ history:true }));
        els.cycleSelect.addEventListener('change', () => {
            activeCycle = loadedCycles.find(cycle => cycle.cycle_id === els.cycleSelect.value) || loadedCycles[0] || null;
            render();
        });

        loadData({ history:true });
    </script>
</body>
</html>
