<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC - Execution Breakdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <style>
        :root {
            --bg:#050505; --panel:#111; --panel2:#171717; --line:#2a2a2a; --line2:#3e3e3e;
            --text:#f5f0e8; --muted:#b8a99a; --dim:#756a64; --red:#d20a0a; --red2:#ff3b3b;
            --gold:#c9a84c; --green:#00d68f; --blue:#69a8ff; --orange:#ff9b52; --purple:#9b8cff;
            --body:'Manrope',sans-serif; --head:'Oswald',sans-serif;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body {
            min-height:100vh; color:var(--text); font-family:var(--body);
            background:
                radial-gradient(ellipse at 18% 0%, rgba(210,10,10,.16), transparent 42%),
                radial-gradient(ellipse at 82% 0%, rgba(201,168,76,.08), transparent 34%),
                linear-gradient(180deg,#050505 0%,#090909 48%,#050505 100%);
            -webkit-font-smoothing:antialiased;
        }
        body::after { content:''; position:fixed; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,var(--red),var(--gold),var(--red),transparent); z-index:99; pointer-events:none; }
        .header { position:sticky; top:3px; z-index:50; background:rgba(5,5,5,.9); border-bottom:1px solid rgba(210,10,10,.25); backdrop-filter:blur(16px); }
        .header-inner, .container { max-width:1480px; margin:0 auto; padding-left:24px; padding-right:24px; }
        .header-inner { min-height:66px; display:flex; justify-content:space-between; align-items:center; gap:16px; }
        .logo, .nav { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .logo-icon { width:36px; height:36px; clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%); background:linear-gradient(135deg,var(--red),#8b0000,var(--gold)); display:grid; place-items:center; font:700 12px var(--head); letter-spacing:1px; }
        .logo h1 { font:700 20px var(--head); letter-spacing:2px; text-transform:uppercase; }
        .logo h1 span { color:var(--gold); font-weight:500; }
        .btn, .select, .search {
            border:1px solid var(--line); border-radius:8px; background:rgba(19,19,19,.95); color:var(--muted);
            font:700 12px var(--body); padding:8px 12px; text-decoration:none;
        }
        .btn { cursor:pointer; display:inline-flex; align-items:center; justify-content:center; min-height:34px; }
        .btn:hover, .btn.active { color:var(--text); border-color:rgba(210,10,10,.45); background:rgba(210,10,10,.16); }
        .container { padding-top:22px; padding-bottom:44px; }
        .topbar { display:grid; grid-template-columns:1fr auto; gap:16px; align-items:end; margin-bottom:16px; }
        .title h2 { font:700 34px var(--head); letter-spacing:0; line-height:1; margin-bottom:8px; }
        .meta { color:var(--muted); font-size:13px; line-height:1.5; }
        .controls { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
        .select, .search { min-height:38px; outline:none; }
        .search { min-width:260px; font-weight:600; }
        .summary-grid { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin-bottom:16px; }
        .summary { border:1px solid rgba(210,10,10,.16); background:rgba(17,17,17,.78); border-left:3px solid var(--red); border-radius:8px; padding:13px; min-height:84px; }
        .summary .k { color:var(--dim); font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px; }
        .summary .v { font:700 24px var(--head); }
        .summary .s { color:var(--muted); font-size:12px; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .fight-list { display:grid; gap:12px; }
        .fight { border:1px solid rgba(210,10,10,.18); background:linear-gradient(180deg,rgba(18,18,18,.95),rgba(8,8,8,.95)); border-radius:8px; overflow:hidden; }
        .fight summary { list-style:none; cursor:pointer; padding:16px 18px; display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center; border-bottom:1px solid rgba(255,255,255,.06); }
        .fight summary::-webkit-details-marker { display:none; }
        .matchup { font:700 22px var(--head); letter-spacing:0; line-height:1.05; }
        .fight-sub { color:var(--muted); font-size:12px; margin-top:7px; display:flex; gap:10px; flex-wrap:wrap; }
        .status-strip { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
        .mini { border:1px solid var(--line); background:rgba(5,5,5,.65); border-radius:999px; padding:5px 8px; font-size:11px; color:var(--muted); font-weight:800; }
        .path-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; border-top:1px solid rgba(255,255,255,.04); }
        .path { min-width:0; padding:15px; border-right:1px solid rgba(255,255,255,.07); display:grid; gap:11px; align-content:start; }
        .path:last-child { border-right:none; }
        .path-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; min-height:42px; }
        .path-title { font-weight:800; font-size:13px; line-height:1.25; }
        .badge { display:inline-flex; align-items:center; justify-content:center; border-radius:999px; padding:5px 8px; font-size:10px; font-weight:900; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; border:1px solid transparent; }
        .st-bet_placed, .st-dry_run, .st-already_bet { color:var(--green); background:rgba(0,214,143,.12); border-color:rgba(0,214,143,.25); }
        .st-skipped, .st-no_market_match, .st-outside_window, .st-event_time_unavailable, .st-not_evaluated { color:var(--muted); background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.09); }
        .st-blocked { color:var(--orange); background:rgba(255,155,82,.12); border-color:rgba(255,155,82,.25); }
        .st-order_failed, .st-order_unknown, .st-incomplete { color:var(--red2); background:rgba(210,10,10,.14); border-color:rgba(210,10,10,.3); }
        .st-candidate, .st-operator_pass { color:var(--blue); background:rgba(105,168,255,.12); border-color:rgba(105,168,255,.25); }
        .gate { color:var(--gold); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; overflow-wrap:anywhere; }
        .explanation { color:var(--text); font-size:13px; line-height:1.5; overflow-wrap:anywhere; }
        .numbers { display:grid; gap:9px; }
        .metric-section { border:1px solid rgba(255,255,255,.08); background:rgba(5,5,5,.36); border-radius:6px; overflow:hidden; }
        .metric-title { padding:7px 9px; background:rgba(255,255,255,.035); color:var(--dim); font-size:10px; font-weight:900; letter-spacing:.09em; text-transform:uppercase; }
        .metric-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:start; padding:7px 9px; border-top:1px solid rgba(255,255,255,.055); }
        .metric-row .k { color:var(--muted); font-size:11px; font-weight:700; line-height:1.35; overflow-wrap:anywhere; }
        .metric-row .v { color:var(--text); font-size:12px; font-weight:850; line-height:1.35; text-align:right; overflow-wrap:anywhere; max-width:180px; }
        .metric-row.positive .v { color:var(--green); }
        .metric-row.negative .v { color:var(--red2); }
        details.tech-wrap { border:1px solid rgba(255,255,255,.07); border-radius:6px; overflow:hidden; }
        .tech-wrap summary { display:block; padding:8px 10px; border:0; background:rgba(255,255,255,.035); font-size:11px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; cursor:pointer; }
        .tech-list { display:grid; gap:0; }
        .order { border:1px solid rgba(0,214,143,.18); background:rgba(0,214,143,.06); border-radius:6px; padding:9px; display:grid; gap:5px; }
        .context { border-color:rgba(105,168,255,.2); background:rgba(105,168,255,.06); }
        .order-row { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:12px; }
        .order-row strong { color:var(--text); overflow-wrap:anywhere; text-align:right; }
        .context .order-row { display:grid; grid-template-columns:104px 1fr; }
        .context .order-row strong { text-align:left; line-height:1.35; }
        details.stage-wrap { border:1px solid rgba(255,255,255,.07); border-radius:6px; overflow:hidden; }
        .stage-wrap summary { display:block; padding:8px 10px; border:0; background:rgba(255,255,255,.04); font-size:11px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
        .stage-list { display:grid; gap:8px; padding:10px; }
        .stage { border-left:2px solid var(--line2); padding-left:8px; color:var(--muted); font-size:12px; line-height:1.45; }
        .stage strong { color:var(--text); }
        .empty { border:1px dashed rgba(255,255,255,.16); border-radius:8px; background:rgba(17,17,17,.65); padding:42px 20px; text-align:center; color:var(--muted); }
        .hidden { display:none; }
        @media (max-width:1200px) { .path-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .path:nth-child(2) { border-right:none; } .path:nth-child(1), .path:nth-child(2) { border-bottom:1px solid rgba(255,255,255,.07); } .summary-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
        @media (max-width:820px) { .topbar, .fight summary { align-items:flex-start; grid-template-columns:1fr; } .logo h1 span { display:none; } .nav { gap:6px; flex-wrap:nowrap; overflow-x:auto; min-width:0; } .nav .btn { padding:6px 10px; font-size:11px; white-space:nowrap; flex-shrink:0; } .controls, .status-strip { justify-content:flex-start; } .path-grid { grid-template-columns:1fr; } .path { border-right:none; border-bottom:1px solid rgba(255,255,255,.07); } .path:last-child { border-bottom:none; } .summary-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .search, .select, .controls .btn { width:100%; } }
        @media (max-width:520px) { .header-inner, .container { padding-left:12px; padding-right:12px; } .summary-grid { grid-template-columns:1fr; } .metric-row { grid-template-columns:1fr; } .metric-row .v { text-align:left; max-width:none; } .matchup { font-size:19px; } .title h2 { font-size:28px; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo"><div class="logo-icon">UFC</div><h1>UFC <span>Execution</span></h1></div>
            <nav class="nav">
                <a href="/" class="btn">Dashboard</a>
                <a href="/bet-history" class="btn">Bet History</a>
                <a href="/predictions" class="btn">Predictions</a>
                <a href="/activity" class="btn">Activity</a>
                <a href="/operator" class="btn">Operator</a>
                <a href="/reasoning" class="btn">Reasoning</a>
                <a href="/execution-breakdown" class="btn active">Execution</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="topbar">
            <div class="title">
                <h2>Execution Breakdown</h2>
                <div class="meta" id="cycleMeta">Loading latest runtime cycle...</div>
            </div>
            <div class="controls">
                <input class="search" id="searchInput" type="search" placeholder="Search fighter or gate">
                <select class="select" id="cycleSelect"><option value="">Latest cycle</option></select>
                <button class="btn hidden" id="olderBtn" type="button">Older cycles</button>
                <button class="btn" id="refreshBtn" type="button">Refresh</button>
            </div>
        </section>

        <section class="summary-grid" id="summaryGrid"></section>
        <section class="fight-list" id="fightList"></section>
        <section class="empty hidden" id="emptyState">No execution audit has been written yet.</section>
    </main>

    <script>
        const PATHS = ['S', 'C', 'M', 'G'];
        const DASHBOARD_TOKEN_STORAGE_KEY = 'dashboardMutationToken';
        const PATH_LABELS = { S: 'Single Trader', C: 'Conviction', M: 'Model Tracker', G: 'Gemini Tracker' };
        let loadedCycles = [];
        let activeCycle = null;
        let searchText = '';
        let nextHistoryOffset = null;

        const els = {
            meta: document.getElementById('cycleMeta'),
            summary: document.getElementById('summaryGrid'),
            list: document.getElementById('fightList'),
            empty: document.getElementById('emptyState'),
            cycleSelect: document.getElementById('cycleSelect'),
            search: document.getElementById('searchInput'),
            refresh: document.getElementById('refreshBtn'),
            older: document.getElementById('olderBtn'),
        };

        function esc(value) {
            const div = document.createElement('div');
            div.textContent = value == null ? '' : String(value);
            return div.innerHTML;
        }

        function dashboardReadHeaders() {
            const token = sessionStorage.getItem(DASHBOARD_TOKEN_STORAGE_KEY);
            return token ? { 'X-Dashboard-Token': token } : {};
        }

        function fmtDate(value) {
            if (!value) return 'Unknown time';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return String(value);
            return date.toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
        }

        function fmtPct(value, signed=false) {
            if (value === undefined || value === null || value === '') return 'N/A';
            const n = Number(value);
            if (!Number.isFinite(n)) return 'N/A';
            const sign = signed && n > 0 ? '+' : '';
            return `${sign}${(n * 100).toFixed(1)}%`;
        }

        function fmtMoney(value) {
            if (value === undefined || value === null || value === '') return 'N/A';
            const n = Number(value);
            return Number.isFinite(n) ? `$${n.toFixed(2)}` : 'N/A';
        }

        function fmtNum(value, digits=4) {
            if (value === undefined || value === null || value === '') return 'N/A';
            const n = Number(value);
            if (!Number.isFinite(n)) return String(value);
            return n.toFixed(digits).replace(/\.?0+$/, '');
        }

        function statusLabel(status) {
            const labels = {
                already_bet: 'already bet',
                bet_placed: 'bet placed',
                dry_run: 'dry run',
                no_market_match: 'no market',
                outside_window: 'outside window',
                order_failed: 'order failed',
                order_unknown: 'order unknown',
                operator_pass: 'operator pass',
                not_evaluated: 'not evaluated',
            };
            return labels[status] || String(status || 'unknown').replace(/_/g, ' ');
        }

        function statusClass(status) {
            return `st-${String(status || 'unknown').replace(/[^a-z0-9_]/gi, '_')}`;
        }

        function firstValue(...values) {
            for (const value of values) {
                if (value !== undefined && value !== null && value !== '') return value;
            }
            return null;
        }

        function hasValue(value) {
            return value !== undefined && value !== null && value !== '' && value !== 'N/A';
        }

        function titleText(value) {
            return String(value || '')
                .replace(/_/g, ' ')
                .replace(/\b\w/g, letter => letter.toUpperCase());
        }

        function formatWindow(window) {
            if (!window || typeof window !== 'object') return null;
            const state = window.state ? titleText(window.state) : (window.open ? 'Open' : 'Closed');
            if (window.detail && !String(window.detail).toLowerCase().includes('window is open')) {
                return `${state}: ${window.detail}`;
            }
            return window.open ? 'Open' : state;
        }

        function rowTone(value, signed=false) {
            if (!signed) return '';
            const n = Number(value);
            if (!Number.isFinite(n) || n === 0) return '';
            return n > 0 ? ' positive' : ' negative';
        }

        function metricSection(title, rows) {
            const visible = rows.filter(row => hasValue(row.value));
            if (!visible.length) return '';
            return `
                <section class="metric-section">
                    <div class="metric-title">${esc(title)}</div>
                    ${visible.map(row => `
                        <div class="metric-row${row.tone || ''}">
                            <div class="k">${esc(row.label)}</div>
                            <div class="v">${esc(row.value)}</div>
                        </div>
                    `).join('')}
                </section>
            `;
        }

        function technicalDetails(numbers, order) {
            const rows = [
                { label:'Market ID', value:numbers.market_id },
                { label:'Condition ID', value:numbers.condition_id },
                { label:'Token ID', value:numbers.token_id },
                { label:'YES token', value:numbers.token_id_yes },
                { label:'NO token', value:numbers.token_id_no },
                { label:'Raw ledger ID', value:firstValue(numbers.ledger_id, numbers.existing_ledger_id, order.ledger_id) },
                { label:'Display ledger ID', value:firstValue(numbers.display_ledger_id, order.display_ledger_id) },
                { label:'Order ID', value:firstValue(numbers.order_id, numbers.existing_order_id, order.order_id) },
            ].filter(row => hasValue(row.value));
            if (!rows.length) return '';
            return `
                <details class="tech-wrap">
                    <summary>Technical IDs</summary>
                    <div class="tech-list">
                        ${rows.map(row => `
                            <div class="metric-row">
                                <div class="k">${esc(row.label)}</div>
                                <div class="v">${esc(row.value)}</div>
                            </div>
                        `).join('')}
                    </div>
                </details>
            `;
        }

        function metricsBlock(numbers, fight, order={}) {
            const requiredEdge = firstValue(numbers.required_edge, numbers.minimum_edge);
            const ledgerId = firstValue(numbers.ledger_id, numbers.existing_ledger_id, order.ledger_id);
            const orderId = firstValue(numbers.order_id, numbers.existing_order_id, order.order_id);
            const sections = [
                metricSection('Decision Inputs', [
                    { label:'Pick', value:numbers.bet_on },
                    { label:'Model probability', value:fmtPct(numbers.model_probability) },
                    { label:'No-odds probability', value:fmtPct(numbers.no_odds_probability) },
                    { label:'Market probability', value:fmtPct(numbers.market_probability) },
                    { label:'Blended probability', value:fmtPct(numbers.blended_probability) },
                    { label:'Edge', value:fmtPct(numbers.edge, true), tone:rowTone(numbers.edge, true) },
                    { label:'Required edge', value:fmtPct(requiredEdge, true), tone:rowTone(requiredEdge, true) },
                    { label:'No-odds edge', value:fmtPct(numbers.no_odds_edge, true), tone:rowTone(numbers.no_odds_edge, true) },
                ]),
                metricSection('Fighter Thresholds', [
                    { label:`${fight.fighter_a || 'Fighter A'} UFC fights`, value:numbers.a_ufc_fights },
                    { label:`${fight.fighter_b || 'Fighter B'} UFC fights`, value:numbers.b_ufc_fights },
                    { label:'Minimum UFC fights', value:numbers.min_fight_threshold },
                ]),
                metricSection('Execution', [
                    { label:'Bet window', value:formatWindow(numbers.bet_window) },
                    { label:'Market ID', value:numbers.market_id },
                    { label:'Ledger ID', value:ledgerId },
                    { label:'Order ID', value:orderId },
                    { label:'Order type', value:firstValue(numbers.order_type, order.order_type) },
                    { label:'Placement state', value:firstValue(numbers.placement_state, order.placement_state, order.status) },
                ]),
                technicalDetails(numbers, order),
            ];
            return sections.join('');
        }

        function orderBlock(order) {
            if (!order || !Object.keys(order).length) return '';
            const matched = order.matched === true ? 'yes' : order.matched === false ? 'no' : null;
            const rows = [
                ['Amount', fmtMoney(firstValue(order.amount, order.submitted_amount, order.requested_amount))],
                ['Price', fmtNum(order.price, 4)],
                ['Type', order.order_type],
                ['State', firstValue(order.placement_state, order.status)],
                ['Ledger', order.ledger_id],
                ['Order', order.order_id],
                ['Matched', matched],
                ['Error', order.error],
            ].filter(([, value]) => value !== undefined && value !== null && value !== '' && value !== 'N/A');
            if (!rows.length) return '';
            return `<div class="order">${rows.map(([k, v]) => `<div class="order-row"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div>`;
        }

        function contextBlock(path) {
            const operator = path.operator || {};
            const tracker = path.tracker_decision || {};
            const rows = [
                ['Original', path.original_reason],
                [operator.verdict ? `Operator ${operator.verdict}` : 'Operator', operator.rationale],
                ['Tracker', tracker.rationale || tracker.summary],
            ].filter(([, value]) => value !== undefined && value !== null && value !== '');
            if (!rows.length) return '';
            return `<div class="order context">${rows.map(([k, v]) => `<div class="order-row"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div>`;
        }

        function stagesBlock(stages) {
            if (!Array.isArray(stages) || !stages.length) return '';
            return `
                <details class="stage-wrap">
                    <summary>Decision stages</summary>
                    <div class="stage-list">
                        ${stages.map(stage => `
                            <div class="stage">
                                <strong>${esc(stage.stage || stage.gate || 'stage')}</strong>
                                ${esc(statusLabel(stage.status))} at ${esc(stage.gate || '')}<br>
                                ${esc(stage.explanation || '')}
                            </div>
                        `).join('')}
                    </div>
                </details>
            `;
        }

        function pathPanel(pathKey, path, fight) {
            const numbers = path.numbers || {};
            const order = path.order || {};
            return `
                <article class="path">
                    <div class="path-head">
                        <div class="path-title">${esc(path.label || PATH_LABELS[pathKey] || pathKey)}</div>
                        <span class="badge ${statusClass(path.status)}">${esc(statusLabel(path.status))}</span>
                    </div>
                    <div class="gate">${esc(path.gate || '')}</div>
                    <div class="explanation">${esc(path.explanation || '')}</div>
                    ${contextBlock(path)}
                    ${orderBlock(order)}
                    <div class="numbers">${metricsBlock(numbers, fight, order)}</div>
                    ${stagesBlock(path.stages)}
                </article>
            `;
        }

        function fightMatches(fight) {
            if (!searchText) return true;
            const haystack = [
                fight.fighter_a, fight.fighter_b, fight.event_title, fight.weight_class,
                ...PATHS.flatMap(path => {
                    const item = fight.paths?.[path] || {};
                    return [
                        item.status, item.gate, item.explanation, item.original_reason,
                        item.operator?.rationale, item.tracker_decision?.rationale,
                        item.numbers?.bet_on,
                    ];
                })
            ].join(' ').toLowerCase();
            return haystack.includes(searchText);
        }

        function fightSection(fight, index) {
            const paths = fight.paths || {};
            const chips = PATHS.map(path => {
                const item = paths[path] || {};
                return `<span class="mini">${path}: ${esc(statusLabel(item.status))}</span>`;
            }).join('');
            return `
                <details class="fight" ${index < 4 ? 'open' : ''}>
                    <summary>
                        <div>
                            <div class="matchup">${esc(fight.fighter_a || '?')} vs ${esc(fight.fighter_b || '?')}</div>
                            <div class="fight-sub">
                                <span>${esc(fight.weight_class || 'UFC')}</span>
                                <span>${esc(fight.event_title || '')}</span>
                                <span>${esc(fmtDate(fight.market_event_date || fight.event_date))}</span>
                            </div>
                        </div>
                        <div class="status-strip">${chips}</div>
                    </summary>
                    <div class="path-grid">
                        ${PATHS.map(path => pathPanel(path, paths[path] || { label: PATH_LABELS[path], status: 'not_evaluated', gate: 'not_evaluated', explanation: 'No decision recorded.', numbers: {}, stages: [] }, fight)).join('')}
                    </div>
                </details>
            `;
        }

        function summaryCards(cycle, fights) {
            const counts = searchText
                ? fights.reduce((result, fight) => {
                    PATHS.forEach(path => {
                        const status = String(fight.paths?.[path]?.status || 'not_evaluated');
                        result[path] = result[path] || {};
                        result[path][status] = Number(result[path][status] || 0) + 1;
                    });
                    return result;
                }, {})
                : (cycle?.path_counts || {});
            const placed = PATHS.reduce((sum, path) => sum + Number(counts[path]?.bet_placed || 0) + Number(counts[path]?.dry_run || 0), 0);
            const already = PATHS.reduce((sum, path) => sum + Number(counts[path]?.already_bet || 0), 0);
            const blocked = PATHS.reduce((sum, path) => sum + Number(counts[path]?.blocked || 0), 0);
            const errors = PATHS.reduce((sum, path) => {
                const item = counts[path] || {};
                return sum + Number(item.incomplete || 0) + Number(item.order_failed || 0) + Number(item.order_unknown || 0);
            }, 0);
            const skipped = PATHS.reduce((sum, path) => {
                const item = counts[path] || {};
                return sum + Number(item.skipped || 0) + Number(item.outside_window || 0) + Number(item.event_time_unavailable || 0) + Number(item.no_market_match || 0);
            }, 0);
            return [
                ['Cycle', cycle?.cycle_id || 'None', cycle?.completed_at ? fmtDate(cycle.completed_at) : 'No completed cycle'],
                ['Fights', fights.length, searchText ? `Filtered from ${cycle?.fight_count || 0}` : (cycle?.event_title || 'Latest runtime cycle')],
                ['Orders', placed, 'Placed or dry-run order results'],
                ['Already Bet', already, 'Open ledger/order prevented a duplicate buy'],
                ['Blocked', blocked, 'Operator, stop-loss, or same-fight blocks'],
                ['Skipped', skipped, 'Strategy, market, window, or executor skips'],
                ['Errors', errors, 'Incomplete, failed, or unknown order results'],
            ].map(([k, v, s]) => `<div class="summary"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s)}</div></div>`).join('');
        }

        function render() {
            const cycle = activeCycle;
            const fights = (cycle?.fights || []).filter(fightMatches);
            els.meta.textContent = cycle
                ? `Cycle ${cycle.cycle_id} completed ${fmtDate(cycle.completed_at)}. ${cycle.dry_run ? 'Dry run' : 'Live mode'}`
                : 'No execution audit has been written yet.';
            els.summary.innerHTML = summaryCards(cycle, fights);
            els.list.innerHTML = fights.map(fightSection).join('');
            els.empty.classList.toggle('hidden', fights.length > 0);
            if (!cycle) els.empty.textContent = 'No execution audit has been written yet.';
            else if (!fights.length) els.empty.textContent = 'No fights match the current search.';
        }

        function populateCycles(cycles) {
            const previous = els.cycleSelect.value;
            els.cycleSelect.innerHTML = cycles.map((cycle, index) => {
                const label = `${index === 0 ? 'Latest: ' : ''}${cycle.cycle_id || 'cycle'} (${fmtDate(cycle.completed_at || cycle.started_at)})`;
                return `<option value="${esc(cycle.cycle_id || '')}">${esc(label)}</option>`;
            }).join('');
            if (previous && cycles.some(cycle => cycle.cycle_id === previous)) {
                els.cycleSelect.value = previous;
            }
        }

        async function fetchExecutionBreakdown({ history=false, offset=0, cycleId='' } = {}) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 12000);
            try {
                const params = new URLSearchParams();
                if (history) {
                    params.set('history', '1');
                    params.set('limit', '20');
                    params.set('offset', String(offset));
                }
                if (cycleId) params.set('cycle_id', cycleId);
                const query = params.toString();
                const path = `/api/execution-breakdown${query ? '?' + query : ''}`;
                const response = await fetch(path, {
                    cache: 'no-store',
                    signal: controller.signal,
                    headers: dashboardReadHeaders(),
                });
                if (!response.ok) {
                    const payload = await response.json().catch(() => ({}));
                    throw new Error(payload.message || payload.error || `HTTP ${response.status}`);
                }
                return await response.json();
            } finally {
                clearTimeout(timeout);
            }
        }

        async function loadData({ history=false, keepActive=false } = {}) {
            els.refresh.disabled = true;
            try {
                const payload = await fetchExecutionBreakdown({ history });
                loadedCycles = (payload.cycles || []).filter(Boolean);
                if (history) {
                    populateCycles(loadedCycles);
                    nextHistoryOffset = payload.next_offset;
                    els.older.classList.toggle('hidden', !payload.has_more);
                }
                if (!keepActive || !activeCycle) {
                    activeCycle = payload.cycle || null;
                }
                render();
            } catch (error) {
                const message = error?.name === 'AbortError' ? 'request timed out' : String(error);
                if (keepActive && activeCycle) {
                    console.warn(`Execution audit history load failed: ${message}`);
                } else {
                    activeCycle = null;
                    els.meta.textContent = `Failed to load execution audit: ${message}`;
                    render();
                }
            } finally {
                els.refresh.disabled = false;
            }
        }

        els.search.addEventListener('input', event => {
            searchText = String(event.target.value || '').trim().toLowerCase();
            render();
        });
        els.refresh.addEventListener('click', () => loadData({ history:true }));
        els.older.addEventListener('click', async () => {
            if (nextHistoryOffset == null) return;
            els.older.disabled = true;
            try {
                const payload = await fetchExecutionBreakdown({ history:true, offset:nextHistoryOffset });
                const known = new Set(loadedCycles.map(cycle => cycle.cycle_id));
                loadedCycles.push(...(payload.cycles || []).filter(cycle => cycle && !known.has(cycle.cycle_id)));
                nextHistoryOffset = payload.next_offset;
                populateCycles(loadedCycles);
                els.older.classList.toggle('hidden', !payload.has_more);
            } catch (error) {
                console.warn(`Execution audit pagination failed: ${error}`);
            } finally {
                els.older.disabled = false;
            }
        });
        els.cycleSelect.addEventListener('change', async () => {
            const cycleId = els.cycleSelect.value;
            if (!cycleId) return;
            els.cycleSelect.disabled = true;
            try {
                const payload = await fetchExecutionBreakdown({ cycleId });
                activeCycle = payload.cycle || null;
                render();
            } catch (error) {
                els.meta.textContent = `Failed to load selected cycle: ${error}`;
            } finally {
                els.cycleSelect.disabled = false;
            }
        });

        async function boot() {
            await loadData();
            if (activeCycle) {
                loadData({ history:true, keepActive:true });
            }
        }

        boot();
    </script>
</body>
</html>
