<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC — Bet History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --bg-elevated: #0e0e0e;
            --card: #131313;
            --card-hover: #1c1c1c;
            --border: #2a2a2a;
            --border-light: #3d3d3d;
            --text: #f5f0e8;
            --text-secondary: #b8a99a;
            --text-muted: #706560;
            --green: #00d68f;
            --green-dim: rgba(0, 214, 143, 0.12);
            --red: #d20a0a;
            --red-bright: #ff2d2d;
            --red-dim: rgba(210, 10, 10, 0.15);
            --blue: #69a8ff;
            --blue-dim: rgba(105, 168, 255, 0.12);
            --purple: #7f8cff;
            --purple-dim: rgba(127, 140, 255, 0.12);
            --yellow: #c9a84c;
            --yellow-dim: rgba(201, 168, 76, 0.12);
            --orange: #ff9b52;
            --orange-dim: rgba(255, 155, 82, 0.12);
            --gold: #c9a84c;
            --accent: #d20a0a;
            --radius: 12px;
            --radius-sm: 8px;
            --body-font: 'Manrope', sans-serif;
            --heading-font: 'Oswald', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--body-font);
            background:
                radial-gradient(ellipse at 20% 0%, rgba(210, 10, 10, 0.18), transparent 45%),
                radial-gradient(ellipse at 80% 0%, rgba(201, 168, 76, 0.08), transparent 35%),
                linear-gradient(180deg, #050505 0%, #0a0a0a 50%, #050505 100%);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.06;
            background-image:
                repeating-linear-gradient(60deg, transparent, transparent 14px, rgba(255,255,255,0.08) 14px, rgba(255,255,255,0.08) 15px),
                repeating-linear-gradient(-60deg, transparent, transparent 14px, rgba(255,255,255,0.08) 14px, rgba(255,255,255,0.08) 15px);
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, transparent 70%);
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--red), var(--gold), var(--red), transparent);
            z-index: 999;
            pointer-events: none;
        }

        .header {
            position: sticky;
            top: 3px;
            z-index: 50;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            background: rgba(5, 5, 5, 0.88);
            border-bottom: 1px solid rgba(210, 10, 10, 0.25);
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
        }

        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 34px; height: 34px;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            display: flex; align-items: center; justify-content: center;
            font: 700 11px var(--heading-font);
            letter-spacing: 1px;
            color: var(--text);
            background: linear-gradient(135deg, var(--red), #8b0000, var(--gold));
        }
        .logo h1 { font-family: var(--heading-font); font-size: 20px; letter-spacing: 2px; text-transform: uppercase; }
        .logo h1 span { color: var(--gold); font-weight: 500; }

        .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .btn {
            padding: 8px 14px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: rgba(19, 19, 19, 0.92);
            color: var(--text-secondary); font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all 0.15s ease; font-family: inherit;
            text-decoration: none; display: inline-flex; align-items: center;
        }
        .btn:hover { background: var(--card-hover); border-color: var(--border-light); color: var(--text); }
        .btn-active { background: rgba(210, 10, 10, 0.15); border-color: rgba(210, 10, 10, 0.3); color: var(--red-bright); }

        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        .page-header { margin-bottom: 20px; }
        .page-title { font-family: var(--heading-font); font-size: 22px; font-weight: 700; letter-spacing: -0.04em; }
        .page-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

        /* Summary stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
        }
        .stat-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .stat-value {
            font-family: var(--heading-font);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.04em;
        }
        .stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .search-input, .date-input {
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        .search-input { flex: 1; min-width: 180px; max-width: 320px; }
        .search-input:focus, .date-input:focus { border-color: var(--accent); }
        .search-input::placeholder { color: var(--text-muted); }
        .date-input { width: 140px; }
        .date-input::-webkit-calendar-picker-indicator { filter: invert(0.7); }

        .filter-btn {
            padding: 7px 14px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--card);
            color: var(--text-secondary); font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all 0.15s ease; font-family: inherit;
        }
        .filter-btn:hover { background: var(--card-hover); border-color: var(--border-light); color: var(--text); }
        .filter-btn.active { background: rgba(210, 10, 10, 0.15); border-color: rgba(210, 10, 10, 0.3); color: var(--red-bright); }

        .date-group { display: flex; align-items: center; gap: 6px; }
        .date-sep { color: var(--text-muted); font-size: 12px; }

        /* Table */
        .section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .table-wrap { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; }

        thead th {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: color 0.15s;
        }
        thead th:hover { color: var(--text-secondary); }
        thead th.sort-active { color: var(--accent); }
        thead th .sort-arrow { font-size: 9px; margin-left: 4px; }

        tbody td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(42, 42, 42, 0.4);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr { transition: background 0.1s; }
        tbody tr:hover { background: rgba(255, 255, 255, 0.02); }

        .right { text-align: right; }
        .center { text-align: center; }
        .positive { color: var(--green); }
        .negative { color: var(--red); }

        .fighter-cell { display: flex; flex-direction: column; gap: 1px; }
        .fighter-name { font-weight: 600; font-size: 13px; }
        .opponent-name { font-size: 11px; color: var(--text-muted); }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .badge-won { background: var(--green-dim); color: var(--green); }
        .badge-lost { background: var(--red-dim); color: var(--red); }
        .badge-dry { background: var(--yellow-dim); color: var(--yellow); }
        .badge-trader { background: var(--blue-dim); color: var(--blue); }
        .badge-push { background: var(--purple-dim); color: var(--purple); }
        .badge-open { background: var(--blue-dim); color: var(--blue); }

        .empty-state {
            padding: 48px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }
        .empty-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.5; }

        /* Show more */
        .show-more-wrap { text-align: center; padding: 14px 0; }
        .show-more-btn {
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 8px 24px;
            background: var(--card-hover);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }
        .show-more-btn:hover { border-color: var(--border-light); color: var(--text); }

        /* Results count */
        .results-info {
            font-size: 12px;
            color: var(--text-muted);
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
        }

        /* Month group headers */
        .month-header td {
            padding: 10px 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            background: rgba(14, 14, 14, 0.6);
            border-bottom: 1px solid var(--border);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .header-inner { padding: 10px 12px; }
            .header-right { gap: 6px; overflow-x: auto; flex-wrap: nowrap; }
            .header-right .btn { padding: 6px 10px; font-size: 11px; white-space: nowrap; flex-shrink: 0; }
            .logo h1 span { display: none; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .stat-card { padding: 12px; }
            .stat-value { font-size: 18px; }
            .search-input { max-width: none; }
            .date-group { width: 100%; }
            .date-input { flex: 1; }
            thead th { font-size: 9px; padding: 10px 8px; }
            tbody td { padding: 10px 8px; font-size: 12px; }
            /* Hide odds column on mobile */
            .col-odds { display: none; }
            .col-trader { display: none; }
        }

        @media (max-width: 480px) {
            .container { padding: 8px; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
            .stat-card { padding: 10px; }
            .stat-value { font-size: 16px; }
            thead th { font-size: 8px; padding: 8px 6px; }
            tbody td { padding: 8px 6px; font-size: 11px; }
            .fighter-name { font-size: 11px; }
            .opponent-name { font-size: 9px; }
            .badge { font-size: 9px; padding: 2px 6px; }
            .col-date { display: none; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">UFC</div>
                <h1>UFC <span>Bet History</span></h1>
            </div>
            <div class="header-right">
                <a href="/" class="btn">Dashboard</a>
                <a href="/bet-history" class="btn btn-active">Bet History</a>
                <a href="/predictions" class="btn">Predictions</a>
                <a href="/activity" class="btn">Activity</a>
                <a href="/execution-breakdown" class="btn">Execution</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <div class="page-title">Bet History</div>
            <div class="page-subtitle" id="pageSubtitle">Loading bet history...</div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Predictions</div>
                <div class="stat-value" id="statPredictions">--</div>
                <div class="stat-sub" id="statPredictionSub"></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total P&amp;L</div>
                <div class="stat-value" id="statPnl">--</div>
                <div class="stat-sub" id="statPnlSub"></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Positions Value</div>
                <div class="stat-value" id="statPositionsValue">--</div>
                <div class="stat-sub" id="statPositionsSub"></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Biggest Win</div>
                <div class="stat-value positive" id="statBiggestWin">--</div>
                <div class="stat-sub" id="statBiggestWinSub"></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Open Bets</div>
                <div class="stat-value" id="statBuyCount">--</div>
                <div class="stat-sub" id="statBuySub"></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Settled Bets</div>
                <div class="stat-value" id="statExitCount">--</div>
                <div class="stat-sub" id="statExitSub"></div>
            </div>
        </div>

        <div class="toolbar">
            <input type="text" class="search-input" id="searchInput" placeholder="Search markets, outcomes..." oninput="applyFilters()">
            <button type="button" class="filter-btn active" onclick="setFilter('all', this)">All</button>
            <button type="button" class="filter-btn" onclick="setFilter('open', this)">Open</button>
            <button type="button" class="filter-btn" onclick="setFilter('won', this)">Won</button>
            <button type="button" class="filter-btn" onclick="setFilter('lost', this)">Lost</button>
            <button type="button" class="filter-btn" onclick="setFilter('sold', this)">Sold</button>
            <div class="date-group">
                <input type="date" class="date-input" id="dateFrom" onchange="applyFilters()" title="From date">
                <span class="date-sep">to</span>
                <input type="date" class="date-input" id="dateTo" onchange="applyFilters()" title="To date">
            </div>
        </div>

        <div class="section">
            <div class="results-info" id="resultsInfo">Loading...</div>
            <div class="table-wrap" id="betTable">
                <div class="empty-state"><div class="empty-icon">--</div>Loading bet history...</div>
            </div>
        </div>
    </div>

    <script>
        let allRows = [];
        let filteredRows = [];
        let liveSummary = null;
        let currentFilter = 'all';
        let showCount = 25;
        let sortCol = 'date';
        let sortDir = -1;

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }

        function toFiniteNumber(value) {
            const num = Number(value);
            return Number.isFinite(num) ? num : null;
        }

        function fmtCurrency(value, { signed = false, digits = 2 } = {}) {
            const num = toFiniteNumber(value);
            if (num == null) return '--';
            const sign = signed && num > 0 ? '+' : '';
            return `${sign}$${num.toFixed(digits)}`;
        }

        function fmtShares(value) {
            const num = toFiniteNumber(value);
            if (num == null) return '--';
            return num.toLocaleString('en-US', {
                minimumFractionDigits: 1,
                maximumFractionDigits: 4,
            });
        }

        function fmtPrice(value, typeLabel) {
            const num = toFiniteNumber(value);
            if (num == null || num <= 0 || typeLabel === 'REDEEM') return '--';
            return `$${num.toFixed(4)}`;
        }

        function fmtPnlValue(row) {
            if (row && row.row_kind === 'activity') {
                return fmtPrice(row.price, row.type_label);
            }
            return fmtCurrency(row && row.pnl, { signed: true });
        }

        function pnlClass(row) {
            if (!row || row.row_kind === 'activity') return '';
            const pnl = toFiniteNumber(row.pnl);
            if (pnl == null) return '';
            return pnl >= 0 ? 'positive' : 'negative';
        }

        function fmtDateTime(iso) {
            if (!iso) return '--';
            const date = new Date(iso);
            if (Number.isNaN(date.valueOf())) return '--';
            return date.toLocaleString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
            });
        }

        function tradeTypeLabel(row) {
            const type = String(row && row.type || '').toUpperCase();
            const side = String(row && row.side || '').toUpperCase();
            if (type === 'TRADE') return side || 'TRADE';
            return type || side || 'UNKNOWN';
        }

        function badgeClass(typeLabel) {
            if (typeLabel === 'OPEN') return 'badge-open';
            if (typeLabel === 'WON') return 'badge-won';
            if (typeLabel === 'LOST') return 'badge-lost';
            if (typeLabel === 'SOLD') return 'badge-push';
            if (typeLabel === 'BUY') return 'badge-open';
            if (typeLabel === 'SELL') return 'badge-won';
            if (typeLabel === 'REDEEM') return 'badge-push';
            return 'badge-trader';
        }

        function tradeTimestampIso(row) {
            const raw = row && row.timestamp;
            const numeric = Number(raw);
            if (Number.isFinite(numeric)) {
                return new Date(numeric * 1000).toISOString();
            }
            const date = new Date(raw || '');
            if (!Number.isNaN(date.valueOf())) {
                return date.toISOString();
            }
            return null;
        }

        function profileBetTimestampIso(row) {
            const raw = row && (row.settled_at || row.placed_at || row.event_date);
            const numeric = Number(raw);
            if (Number.isFinite(numeric)) {
                return new Date(numeric * 1000).toISOString();
            }
            const date = new Date(raw || '');
            if (!Number.isNaN(date.valueOf())) {
                return date.toISOString();
            }
            return null;
        }

        function mapProfileBetRow(row, index) {
            const status = String(row && (row.status || row.trade_side) || 'unknown').toUpperCase();
            const isOpen = status === 'OPEN';
            const pnl = isOpen
                ? toFiniteNumber(row && row.unrealized_pnl)
                : toFiniteNumber(row && row.result_pnl);
            const fighter = String(row && (row.fighter || row.side || row.outcome) || '');
            const opponent = String(row && row.opponent || '');
            const event = String(row && (row.event || row.market || row.title) || '');
            const detailParts = [];
            if (opponent) detailParts.push(`vs ${opponent}`);
            if (event && event !== fighter) detailParts.push(event);
            if (row && row.trader_label) detailParts.push(`Trader ${row.trader_label}`);

            return {
                id: String(row && (row.token_id || row.id) || `profile-bet-${index}`),
                row_kind: 'bet',
                filter_key: status.toLowerCase(),
                type_label: status,
                market: fighter || event || 'Unknown market',
                outcome: detailParts.join(' · '),
                amount: toFiniteNumber(row && (row.amount ?? row.invested)) ?? 0,
                shares: toFiniteNumber(row && row.shares),
                price: toFiniteNumber(row && (row.avg_price ?? row.price)),
                pnl,
                date_iso: profileBetTimestampIso(row),
                raw: row || {},
            };
        }

        function mapTradeRow(row, index) {
            return {
                id: String(row && row.id || `activity-${index}`),
                row_kind: 'activity',
                filter_key: String(tradeTypeLabel(row)).toLowerCase(),
                type_label: tradeTypeLabel(row),
                market: String(row && (row.title || row.market) || 'Unknown market'),
                outcome: String(row && row.outcome || ''),
                amount: toFiniteNumber(row && row.usdcSize) ?? 0,
                shares: toFiniteNumber(row && row.size),
                price: toFiniteNumber(row && row.price),
                pnl: null,
                date_iso: tradeTimestampIso(row),
                raw: row || {},
            };
        }

        function setFilter(filterName, el) {
            currentFilter = filterName;
            showCount = 25;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (el) el.classList.add('active');
            applyFilters();
        }

        function sortArrow(col) {
            if (sortCol !== col) return '';
            return `<span class="sort-arrow">${sortDir === 1 ? '\u25B2' : '\u25BC'}</span>`;
        }

        function setSort(col) {
            if (sortCol === col) {
                sortDir *= -1;
            } else {
                sortCol = col;
                sortDir = col === 'date' ? -1 : 1;
            }
            showCount = 25;
            sortRows();
            renderTable();
        }

        function sortRows() {
            filteredRows.sort((a, b) => {
                let va;
                let vb;

                switch (sortCol) {
                    case 'type':
                        va = a.type_label || '';
                        vb = b.type_label || '';
                        break;
                    case 'market':
                        va = `${a.market || ''} ${a.outcome || ''}`.toLowerCase();
                        vb = `${b.market || ''} ${b.outcome || ''}`.toLowerCase();
                        break;
                    case 'amount':
                        va = a.amount ?? -1;
                        vb = b.amount ?? -1;
                        break;
                    case 'shares':
                        va = a.shares ?? -1;
                        vb = b.shares ?? -1;
                        break;
                    case 'price':
                        va = a.price ?? -1;
                        vb = b.price ?? -1;
                        break;
                    case 'pnl':
                        va = a.pnl ?? -Infinity;
                        vb = b.pnl ?? -Infinity;
                        break;
                    case 'date':
                    default:
                        va = a.date_iso ? new Date(a.date_iso).valueOf() : 0;
                        vb = b.date_iso ? new Date(b.date_iso).valueOf() : 0;
                        break;
                }

                if (va < vb) return -1 * sortDir;
                if (va > vb) return 1 * sortDir;
                return 0;
            });
        }

        function updateStats() {
            const predictionCount = toFiniteNumber(liveSummary && liveSummary.profile_predictions) ?? allRows.length;
            const totalPnl = toFiniteNumber(liveSummary && liveSummary.total_pnl);
            const positionsValue =
                toFiniteNumber(liveSummary && liveSummary.positions_value)
                ?? toFiniteNumber(liveSummary && liveSummary.open_invested);
            const biggestWin = toFiniteNumber(liveSummary && liveSummary.profile_largest_win);
            const openPositions = toFiniteNumber(liveSummary && liveSummary.open_bets);

            const openRows = allRows.filter(row => row.type_label === 'OPEN').length;
            const wonRows = allRows.filter(row => row.type_label === 'WON').length;
            const lostRows = allRows.filter(row => row.type_label === 'LOST').length;
            const soldRows = allRows.filter(row => row.type_label === 'SOLD').length;
            const settledRows = wonRows + lostRows + soldRows;
            const rowLabel = allRows.some(row => row.row_kind === 'activity') ? 'activity rows' : 'all-time bet rows';

            document.getElementById('statPredictions').textContent = predictionCount.toLocaleString('en-US');
            document.getElementById('statPredictionSub').textContent = `${allRows.length.toLocaleString('en-US')} ${rowLabel}`;

            const pnlEl = document.getElementById('statPnl');
            pnlEl.textContent = fmtCurrency(totalPnl, { signed: true });
            pnlEl.className = `stat-value ${totalPnl != null ? (totalPnl >= 0 ? 'positive' : 'negative') : ''}`.trim();
            document.getElementById('statPnlSub').textContent = 'All-time on Polymarket profile';

            document.getElementById('statPositionsValue').textContent = fmtCurrency(positionsValue);
            document.getElementById('statPositionsSub').textContent = openPositions != null
                ? `${openPositions.toLocaleString('en-US')} open positions`
                : 'Current profile holdings';

            const biggestWinEl = document.getElementById('statBiggestWin');
            biggestWinEl.textContent = biggestWin != null ? fmtCurrency(biggestWin, { signed: true }) : '--';
            biggestWinEl.className = `stat-value ${biggestWin != null ? (biggestWin >= 0 ? 'positive' : 'negative') : ''}`.trim();
            document.getElementById('statBiggestWinSub').textContent = 'Largest win on profile';

            document.getElementById('statBuyCount').textContent = openRows.toLocaleString('en-US');
            document.getElementById('statBuySub').textContent = `${allRows.length.toLocaleString('en-US')} total bets`;

            document.getElementById('statExitCount').textContent = settledRows.toLocaleString('en-US');
            document.getElementById('statExitSub').textContent =
                `${wonRows.toLocaleString('en-US')} won, ${lostRows.toLocaleString('en-US')} lost, ${soldRows.toLocaleString('en-US')} sold`;
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;

            filteredRows = allRows.filter(row => {
                if (currentFilter !== 'all' && row.filter_key !== currentFilter) {
                    return false;
                }

                if (query) {
                    const haystack = [row.market, row.outcome, row.type_label, row.raw && row.raw.reason]
                        .filter(Boolean)
                        .join(' ')
                        .toLowerCase();
                    if (!haystack.includes(query)) return false;
                }

                if (dateFrom || dateTo) {
                    if (!row.date_iso) return false;
                    const rowTime = new Date(row.date_iso).valueOf();
                    if (Number.isNaN(rowTime)) return false;
                    if (dateFrom) {
                        const fromTime = new Date(`${dateFrom}T00:00:00`).valueOf();
                        if (rowTime < fromTime) return false;
                    }
                    if (dateTo) {
                        const toTime = new Date(`${dateTo}T23:59:59.999`).valueOf();
                        if (rowTime > toTime) return false;
                    }
                }

                return true;
            });

            sortRows();
            updateStats();
            renderTable();
        }

        function renderTable() {
            const el = document.getElementById('betTable');
            const info = document.getElementById('resultsInfo');

            if (!filteredRows.length) {
                info.textContent = 'No matching bet rows';
                el.innerHTML = '<div class="empty-state"><div class="empty-icon">--</div>No Polymarket bets match your filters</div>';
                return;
            }

            const visible = filteredRows.slice(0, showCount);
            const rowLabel = filteredRows.some(row => row.row_kind === 'activity') ? 'activity rows' : 'all-time bets';
            info.textContent = `Showing ${visible.length} of ${filteredRows.length} ${rowLabel}`;

            const rows = visible.map(row => `
                <tr>
                    <td class="center"><span class="badge ${badgeClass(row.type_label)}">${esc(row.type_label)}</span></td>
                    <td>
                        <div class="fighter-cell">
                            <span class="fighter-name">${esc(row.market)}</span>
                            <span class="opponent-name">${esc(row.outcome || 'No outcome label')}</span>
                        </div>
                    </td>
                    <td class="right">${fmtCurrency(row.amount)}</td>
                    <td class="right">${fmtShares(row.shares)}</td>
                    <td class="right ${pnlClass(row)}">${fmtPnlValue(row)}</td>
                    <td class="right col-date">${fmtDateTime(row.date_iso)}</td>
                </tr>
            `).join('');

            const remaining = filteredRows.length - showCount;
            const showMoreHtml = remaining > 0
                ? `<div class="show-more-wrap">
                    <button type="button" class="show-more-btn" onclick="loadMore()">
                        Show more (${remaining} remaining)
                    </button>
                </div>`
                : (filteredRows.length > 25
                    ? `<div class="show-more-wrap">
                        <button type="button" class="show-more-btn" onclick="collapseRows()">Show less</button>
                    </div>`
                    : '');

            const thClass = (col) => sortCol === col ? 'sort-active' : '';

            el.innerHTML = `<table>
                <thead><tr>
                    <th class="center ${thClass('type')}" onclick="setSort('type')">Type ${sortArrow('type')}</th>
                    <th class="${thClass('market')}" onclick="setSort('market')">Market ${sortArrow('market')}</th>
                    <th class="right ${thClass('amount')}" onclick="setSort('amount')">Amount ${sortArrow('amount')}</th>
                    <th class="right ${thClass('shares')}" onclick="setSort('shares')">Shares ${sortArrow('shares')}</th>
                    <th class="right ${thClass('pnl')}" onclick="setSort('pnl')">P&amp;L / Price ${sortArrow('pnl')}</th>
                    <th class="right col-date ${thClass('date')}" onclick="setSort('date')">Date ${sortArrow('date')}</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>${showMoreHtml}`;
        }

        function loadMore() {
            showCount = Math.min(showCount + 50, filteredRows.length);
            renderTable();
        }

        function collapseRows() {
            showCount = 25;
            renderTable();
            document.querySelector('.section').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        async function fetchHistory() {
            try {
                const profileResp = await fetch('/api/profile-bets');
                if (!profileResp.ok) {
                    throw new Error(`/api/profile-bets returned HTTP ${profileResp.status}`);
                }

                const profilePayload = await profileResp.json();
                liveSummary = profilePayload && profilePayload.summary ? profilePayload.summary : {};
                const betRows = profilePayload && Array.isArray(profilePayload.bets) ? profilePayload.bets : [];
                allRows = betRows.map(mapProfileBetRow);

                const subtitleParts = [];
                if (liveSummary && liveSummary.profile_username) {
                    subtitleParts.push(liveSummary.profile_username);
                }
                subtitleParts.push(`${allRows.length.toLocaleString('en-US')} all-time profile bets`);
                if (liveSummary && liveSummary._pnl_degraded) {
                    subtitleParts.push('live data degraded');
                }
                document.getElementById('pageSubtitle').textContent = subtitleParts.join(' · ');

                applyFilters();
            } catch (e) {
                console.error('Failed to load profile bets:', e);
                try {
                    const [summaryResp, tradeResp] = await Promise.all([
                        fetch('/api/summary'),
                        fetch('/api/trade-history?limit=1000'),
                    ]);
                    if (!summaryResp.ok) {
                        throw new Error(`/api/summary returned HTTP ${summaryResp.status}`);
                    }
                    if (!tradeResp.ok) {
                        throw new Error(`/api/trade-history?limit=1000 returned HTTP ${tradeResp.status}`);
                    }

                    liveSummary = await summaryResp.json();
                    const tradeRows = await tradeResp.json();
                    allRows = Array.isArray(tradeRows) ? tradeRows.map(mapTradeRow) : [];

                    const subtitleParts = [];
                    if (liveSummary && liveSummary.profile_username) {
                        subtitleParts.push(liveSummary.profile_username);
                    }
                    subtitleParts.push(`${allRows.length.toLocaleString('en-US')} recent activity rows`);
                    subtitleParts.push('profile bets unavailable');
                    document.getElementById('pageSubtitle').textContent = subtitleParts.join(' · ');
                    applyFilters();
                } catch (fallbackError) {
                    console.error('Failed to load Polymarket fallback activity:', fallbackError);
                    document.getElementById('pageSubtitle').textContent = 'Failed to load Polymarket bet history';
                    document.getElementById('resultsInfo').textContent = 'Load failed';
                    document.getElementById('betTable').innerHTML =
                        '<div class="empty-state"><div class="empty-icon">--</div>Failed to load Polymarket bet history</div>';
                }
            }
        }

        fetchHistory();
    </script>
</body>
</html>
