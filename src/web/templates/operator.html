<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC — LLM Operator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --bg-elevated: #0e0e0e;
            --card: #131313;
            --card-hover: #1c1c1c;
            --border: #2a2a2a;
            --border-light: #3d3d3d;
            --text: #f5f0e8;
            --text-secondary: #b8a99a;
            --text-muted: #706560;
            --green: #00d68f;
            --green-dim: rgba(0, 214, 143, 0.12);
            --red: #d20a0a;
            --red-bright: #ff2d2d;
            --red-dim: rgba(210, 10, 10, 0.15);
            --blue: #69a8ff;
            --blue-dim: rgba(105, 168, 255, 0.12);
            --purple: #a78bfa;
            --purple-dim: rgba(167, 139, 250, 0.12);
            --yellow: #c9a84c;
            --yellow-dim: rgba(201, 168, 76, 0.12);
            --orange: #fb923c;
            --orange-dim: rgba(251, 146, 60, 0.12);
            --gold: #c9a84c;
            --accent: #d20a0a;
            --radius: 12px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--red), var(--gold), var(--red), transparent);
            z-index: 999;
            pointer-events: none;
        }

        .header {
            position: sticky;
            top: 3px;
            z-index: 50;
            background: rgba(5, 5, 5, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(210, 10, 10, 0.25);
        }

        .header-inner {
            max-width: 1360px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
        }

        .logo { display: flex; align-items: center; gap: 10px; }

        .logo-icon {
            width: 34px; height: 34px;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            background: linear-gradient(135deg, var(--red), #8b0000, var(--gold));
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 11px; letter-spacing: 1px;
            font-family: 'Oswald', sans-serif;
        }

        .logo h1 { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        .logo h1 span { color: var(--gold); font-weight: 400; }

        .header-right { display: flex; align-items: center; gap: 10px; }

        .btn {
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:hover { background: var(--bg-elevated); color: var(--text); border-color: var(--border-light); }
        .btn-active { background: rgba(210, 10, 10, 0.2); color: var(--red-bright); border-color: rgba(210, 10, 10, 0.35); }
        .btn-active:hover { background: rgba(210, 10, 10, 0.3); }

        .container { max-width: 1360px; margin: 0 auto; padding: 24px; }

        .page-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .page-subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }

        .stats-row {
            display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;
        }
        .stat-chip {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .stat-chip strong { color: var(--text); margin-right: 4px; }

        .filter-row {
            display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .list-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .list-summary {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .filter-btn {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }
        .filter-btn:hover { background: var(--bg-elevated); color: var(--text); }
        .filter-btn.active { background: rgba(210, 10, 10, 0.2); color: var(--red-bright); border-color: rgba(210, 10, 10, 0.35); }

        .sport-badge {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-left: 8px;
        }
        .sport-badge-ufc { background: var(--red-dim); color: var(--red); }
        .filter-sep { width: 1px; height: 20px; background: var(--border); align-self: center; }

        .decision-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 12px;
            transition: border-color 0.15s;
        }
        .decision-card:hover { border-color: var(--border-light); }
        .decision-card.pass { border-left: 3px solid var(--green); }
        .decision-card.block { border-left: 3px solid var(--red); }

        .decision-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 12px;
        }

        .decision-fighters {
            font-size: 16px;
            font-weight: 600;
        }
        .decision-fighters .bet-on { color: var(--accent); }

        .verdict-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .verdict-pass { background: var(--green-dim); color: var(--green); }
        .verdict-block { background: var(--red-dim); color: var(--red); }

        .decision-meta {
            display: flex; gap: 16px; flex-wrap: wrap;
            font-size: 12px; color: var(--text-muted);
            margin-bottom: 12px;
        }
        .decision-meta span { display: flex; align-items: center; gap: 4px; }

        .decision-rationale {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding: 12px;
            background: var(--bg-elevated);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            word-break: break-word;
        }

        .risk-flags {
            display: flex; flex-direction: column; gap: 6px;
        }
        .risk-flag {
            font-size: 12px;
            padding: 6px 10px;
            background: var(--yellow-dim);
            color: var(--yellow);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(245, 197, 66, 0.15);
        }

        .provenance-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .provenance-chip {
            font-size: 11px;
            color: var(--gold);
            background: var(--yellow-dim);
            border: 1px solid rgba(201, 168, 76, 0.2);
            border-radius: 999px;
            padding: 5px 10px;
        }

        .matchup-section {
            margin-top: 12px;
            padding: 12px;
            background: var(--bg-elevated);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Inter', monospace;
            display: none;
        }
        .matchup-section.visible { display: block; }

        .toggle-details {
            font-size: 12px;
            color: var(--accent);
            cursor: pointer;
            border: none;
            background: none;
            margin-top: 8px;
            padding: 0;
        }
        .toggle-details:hover { text-decoration: underline; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text-secondary); }

        .timestamp {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .header-inner { padding: 10px 12px; }
            .header-right { gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap; }
            .header-right .btn { padding: 6px 10px; font-size: 11px; white-space: nowrap; flex-shrink: 0; }
            .logo h1 span { display: none; }
            .page-title { font-size: 18px; }
            .page-subtitle { font-size: 12px; }
            .stats-row { gap: 6px; }
            .stat-chip { padding: 6px 10px; font-size: 12px; }
            .decision-card { padding: 14px; }
            .decision-header { flex-direction: column; gap: 8px; }
            .decision-fighters { font-size: 14px; }
            .decision-meta { gap: 8px; font-size: 11px; }
            .decision-rationale { font-size: 12px; padding: 10px; }
            .provenance-row { gap: 6px; }
            .provenance-chip { font-size: 10px; padding: 4px 8px; }
            .risk-flag { font-size: 11px; }
            .matchup-section { font-size: 11px; padding: 10px; }
            .list-toolbar { align-items: stretch; }
            .list-toolbar .btn { width: 100%; }
        }

        @media (max-width: 480px) {
            .container { padding: 8px; }
            .header-inner { padding: 8px 10px; }
            .logo-icon { width: 28px; height: 28px; font-size: 12px; }
            .logo h1 { font-size: 15px; }
            .stats-row { gap: 4px; }
            .stat-chip { padding: 5px 8px; font-size: 11px; }
            .filter-btn { padding: 5px 10px; font-size: 11px; }
            .decision-card { padding: 12px; margin-bottom: 8px; }
            .decision-fighters { font-size: 13px; }
            .decision-meta { gap: 6px; font-size: 10px; flex-direction: column; }
            .decision-rationale { font-size: 11px; padding: 8px; }
            .provenance-chip { font-size: 9px; }
            .verdict-badge { font-size: 11px; padding: 3px 10px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">UFC</div>
                <h1>UFC <span>LLM Operator</span></h1>
            </div>
            <div class="header-right">
                <a href="/" class="btn">Dashboard</a>
                <a href="/bet-history" class="btn">Bet History</a>
                <a href="/predictions" class="btn">Predictions</a>
                <a href="/activity" class="btn">Activity</a>
                <a href="/operator" class="btn btn-active">Operator</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="page-title">LLM Operator Decisions</div>
        <div class="page-subtitle">Gemini fight analyst — PASS/BLOCK gate on every bet candidate</div>

        <div class="stats-row" id="statsRow">
            <div class="stat-chip"><strong id="totalCount">0</strong> total decisions</div>
            <div class="stat-chip"><strong id="passCount" style="color:var(--green)">0</strong> passed</div>
            <div class="stat-chip"><strong id="blockCount" style="color:var(--red)">0</strong> blocked</div>
            <div class="stat-chip"><strong id="blockRate" style="color:var(--yellow)">0%</strong> block rate</div>
        </div>

        <div class="filter-row">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="PASS">Passed</button>
            <button class="filter-btn" data-filter="BLOCK">Blocked</button>
        </div>

        <div class="list-toolbar">
            <div class="list-summary" id="decisionSummary">Loading recent decisions...</div>
            <button type="button" class="btn" id="loadMoreBtn" style="display:none;" onclick="loadMoreDecisions()">Show more</button>
        </div>

        <div id="decisionsContainer">
            <div class="empty-state">
                <h3>Loading decisions...</h3>
                <p>Fetching operator decision log</p>
            </div>
        </div>
    </div>

    <script>
        const OPERATOR_FETCH_BATCH = 120;
        const OPERATOR_RENDER_BATCH = 50;
        const OPERATOR_REFRESH_MS = 60000;
        let allDecisions = [];
        let activeFilter = 'all';
        let activeSportFilter = 'all';
        let operatorTotalCount = 0;
        let currentFetchLimit = OPERATOR_FETCH_BATCH;
        let visibleDecisionCount = OPERATOR_RENDER_BATCH;
        let latestDecisionFetchId = 0;
        let operatorFetchController = null;
        let operatorRefreshTimer = null;
        let lastDecisionFetchStartedAt = 0;

        function readApiError(response, fallback) {
            return response.json()
                .then(payload => payload && (payload.message || payload.error || fallback))
                .catch(() => fallback);
        }

        function abortDecisionFetch() {
            if (operatorFetchController) {
                operatorFetchController.abort();
                operatorFetchController = null;
            }
        }

        function shouldRefreshDecisions(force) {
            if (force) return true;
            const now = Date.now();
            if (!lastDecisionFetchStartedAt) return true;
            return (now - lastDecisionFetchStartedAt) >= 5000;
        }

        function ensureDecisionRefreshTimer() {
            if (operatorRefreshTimer) return;
            operatorRefreshTimer = setInterval(() => {
                if (document.visibilityState === 'visible') {
                    loadDecisions();
                }
            }, OPERATOR_REFRESH_MS);
        }

        function setSportFilter(sport, el) {
            activeSportFilter = sport;
            document.querySelectorAll('.filter-btn[data-sport]').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            updateStats();
            renderDecisions();
        }

        function sportFiltered() {
            if (activeSportFilter === 'all') return allDecisions;
            return allDecisions.filter(d => (d.sport || 'ufc') === activeSportFilter);
        }

        function filteredDecisions() {
            const base = sportFiltered();
            const passVerdicts = ['PASS', 'NO_VETO'];
            const blockVerdicts = ['BLOCK', 'AUTO_BLOCK', 'AUTO_SKIP'];
            if (activeFilter === 'all') return base;
            if (activeFilter === 'PASS') return base.filter(d => passVerdicts.includes(d.verdict));
            if (activeFilter === 'BLOCK') return base.filter(d => blockVerdicts.includes(d.verdict));
            return base.filter(d => d.verdict === activeFilter);
        }

        function renderDecisionSummary(filteredCount) {
            const summary = document.getElementById('decisionSummary');
            const loaded = allDecisions.length;
            if (!loaded) {
                summary.textContent = 'No operator decisions loaded.';
                return;
            }
            const scope = loaded < operatorTotalCount
                ? `Showing latest ${loaded} of ${operatorTotalCount} decisions`
                : `Showing ${loaded} decisions`;
            summary.textContent = filteredCount !== loaded
                ? `${scope} • ${filteredCount} match current filters`
                : scope;
        }

        function renderLoadMoreButton(filteredCount) {
            const button = document.getElementById('loadMoreBtn');
            if (!button) return;
            if (filteredCount > visibleDecisionCount) {
                button.textContent = `Show more (${filteredCount - visibleDecisionCount} hidden)`;
                button.style.display = '';
                return;
            }
            if (allDecisions.length < operatorTotalCount) {
                button.textContent = `Load more history (${operatorTotalCount - allDecisions.length} remaining)`;
                button.style.display = '';
                return;
            }
            button.style.display = 'none';
        }

        async function loadDecisions(force = false) {
            if (!shouldRefreshDecisions(force)) return;

            const fetchId = ++latestDecisionFetchId;
            lastDecisionFetchStartedAt = Date.now();
            abortDecisionFetch();
            operatorFetchController = new AbortController();
            try {
                const resp = await fetch(`/api/operator-decisions?limit=${currentFetchLimit}`, {
                    cache: 'no-store',
                    signal: operatorFetchController.signal,
                });
                if (!resp.ok) {
                    throw new Error(await readApiError(resp, `HTTP ${resp.status}`));
                }
                const data = await resp.json();
                if (fetchId !== latestDecisionFetchId) {
                    return;
                }
                allDecisions = data.decisions || [];
                operatorTotalCount = Number(data.total_count || allDecisions.length);
                visibleDecisionCount = Math.min(
                    Math.max(visibleDecisionCount, OPERATOR_RENDER_BATCH),
                    Math.max(allDecisions.length, OPERATOR_RENDER_BATCH),
                );
                updateStats();
                renderDecisions();
            } catch (err) {
                if (err && err.name === 'AbortError') {
                    return;
                }
                if (fetchId !== latestDecisionFetchId) {
                    return;
                }
                renderDecisionSummary(0);
                renderLoadMoreButton(0);
                document.getElementById('decisionsContainer').innerHTML =
                    '<div class="empty-state"><h3>Failed to load</h3><p>' + escapeHtml(err.message) + '</p></div>';
            } finally {
                if (operatorFetchController && fetchId === latestDecisionFetchId) {
                    operatorFetchController = null;
                }
            }
        }

        function updateStats() {
            const base = sportFiltered();
            const total = base.length;
            const passed = base.filter(d => d.verdict === 'PASS' || d.verdict === 'NO_VETO').length;
            const blocked = base.filter(d => d.verdict === 'BLOCK' || d.verdict === 'AUTO_BLOCK' || d.verdict === 'AUTO_SKIP').length;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('passCount').textContent = passed;
            document.getElementById('blockCount').textContent = blocked;
            document.getElementById('blockRate').textContent = total > 0 ? Math.round(blocked / total * 100) + '%' : '0%';
        }

        function renderDecisions() {
            const container = document.getElementById('decisionsContainer');
            const filtered = filteredDecisions();
            const visible = filtered.slice(0, visibleDecisionCount);
            renderDecisionSummary(filtered.length);
            renderLoadMoreButton(filtered.length);

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><h3>No decisions found</h3><p>No operator decisions match the current filter</p></div>';
                return;
            }

            container.innerHTML = visible.map(d => {
                const isPass = d.verdict === 'PASS' || d.verdict === 'NO_VETO';
                const verdictClass = isPass ? 'pass' : 'block';
                const verdictBadge = isPass ? 'verdict-pass' : 'verdict-block';
                const betOnName = d.bet_on || d.decision_fighter || 'Unknown';
                const fighterA = d.fighter_a || '?';
                const fighterB = d.fighter_b || '?';
                const ts = d.timestamp ? new Date(d.timestamp).toLocaleString() : 'Unknown time';
                const edge = d.edge != null ? (d.edge * 100).toFixed(1) + '%' : 'N/A';
                const modelProb = d.model_prob != null ? (d.model_prob * 100).toFixed(1) + '%' : 'N/A';
                const marketProb = d.market_prob != null ? (d.market_prob * 100).toFixed(1) + '%' : 'N/A';
                const operatorProb = d.operator_prob != null ? (d.operator_prob * 100).toFixed(1) + '%' : 'N/A';
                const provenance = d.provenance || {};
                const betOnLabel = betOnName !== 'Unknown'
                    ? 'Bet On: ' + escapeHtml(betOnName)
                    : 'Bet On: Unknown';
                const probContextLabel = betOnName !== 'Unknown'
                    ? ' (' + escapeHtml(betOnName) + ')'
                    : '';

                const riskFlags = (d.risk_flags || []).map(f =>
                    '<div class="risk-flag">' + escapeHtml(f) + '</div>'
                ).join('');

                const provenanceChips = [];
                if (provenance.bundle_id) provenanceChips.push('<div class="provenance-chip">Bundle: ' + escapeHtml(provenance.bundle_id) + '</div>');
                if (provenance.model_spec_name) provenanceChips.push('<div class="provenance-chip">Spec: ' + escapeHtml(provenance.model_spec_name) + '</div>');
                if (provenance.processed_snapshot_max_event_date) provenanceChips.push('<div class="provenance-chip">Snapshot: ' + escapeHtml(provenance.processed_snapshot_max_event_date) + '</div>');
                if (provenance.fighter_a_source) provenanceChips.push('<div class="provenance-chip">' + escapeHtml(fighterA) + ': ' + escapeHtml(provenance.fighter_a_source) + '</div>');
                if (provenance.fighter_b_source) provenanceChips.push('<div class="provenance-chip">' + escapeHtml(fighterB) + ': ' + escapeHtml(provenance.fighter_b_source) + '</div>');

                const matchup = d.research_summary && d.research_summary.matchup_analysis
                    ? escapeHtml(d.research_summary.matchup_analysis) : '';

                const motivation = d.research_summary && d.research_summary.motivation_flags
                    ? d.research_summary.motivation_flags.map(f => escapeHtml(f)).join('\n') : '';

                const provenanceDetails = [
                    provenance.bundle_id ? 'bundle_id: ' + escapeHtml(provenance.bundle_id) : '',
                    provenance.model_spec_name ? 'model_spec_name: ' + escapeHtml(provenance.model_spec_name) : '',
                    provenance.processed_dir ? 'processed_dir: ' + escapeHtml(provenance.processed_dir) : '',
                    provenance.processed_snapshot_max_event_date ? 'processed_snapshot_max_event_date: ' + escapeHtml(provenance.processed_snapshot_max_event_date) : '',
                    provenance.fighter_a_source ? escapeHtml(fighterA) + '_source: ' + escapeHtml(provenance.fighter_a_source) : '',
                    provenance.fighter_b_source ? escapeHtml(fighterB) + '_source: ' + escapeHtml(provenance.fighter_b_source) : '',
                    provenance.manifest_path ? 'manifest_path: ' + escapeHtml(provenance.manifest_path) : '',
                ].filter(Boolean).join('\n');

                const detailsContent = [matchup, motivation, provenanceDetails].filter(Boolean).join('\n\n');

                // Highlight the bet_on fighter in the matchup title
                const fighterADisplay = betOnName === fighterA
                    ? '<span class="bet-on">' + escapeHtml(fighterA) + '</span>'
                    : escapeHtml(fighterA);
                const fighterBDisplay = betOnName === fighterB
                    ? '<span class="bet-on">' + escapeHtml(fighterB) + '</span>'
                    : escapeHtml(fighterB);

                const sportBadge = '<span class="sport-badge sport-badge-ufc">UFC</span>';

                return '<div class="decision-card ' + verdictClass + '">' +
                    '<div class="decision-header">' +
                        '<div class="decision-fighters">' + fighterADisplay + ' vs ' + fighterBDisplay + sportBadge + '</div>' +
                        '<span class="verdict-badge ' + verdictBadge + '">' + d.verdict + '</span>' +
                    '</div>' +
                    '<div class="decision-meta">' +
                        (d.tournament_name ? '<span>' + escapeHtml(d.tournament_name) + (d.tour ? ' (' + escapeHtml(d.tour.toUpperCase()) + ')' : '') + '</span>' : '') +
                        '<span>' + betOnLabel + '</span>' +
                        '<span>Model' + probContextLabel + ': ' + modelProb + '</span>' +
                        '<span>Market' + probContextLabel + ': ' + marketProb + '</span>' +
                        '<span>Operator' + probContextLabel + ': ' + operatorProb + '</span>' +
                        '<span>Edge: ' + edge + '</span>' +
                        '<span class="timestamp">' + ts + '</span>' +
                    '</div>' +
                    '<div class="decision-rationale">' + escapeHtml(d.rationale || 'No rationale provided') + '</div>' +
                    (provenanceChips.length ? '<div class="provenance-row">' + provenanceChips.join('') + '</div>' : '') +
                    (riskFlags ? '<div class="risk-flags">' + riskFlags + '</div>' : '') +
                    (detailsContent ? '<button class="toggle-details" onclick="toggleDetails(this)">Show matchup details</button>' +
                        '<div class="matchup-section">' + detailsContent + '</div>' : '') +
                '</div>';
            }).join('');
        }

        function loadMoreDecisions() {
            const filtered = filteredDecisions();
            if (visibleDecisionCount < filtered.length) {
                visibleDecisionCount = Math.min(visibleDecisionCount + OPERATOR_RENDER_BATCH, filtered.length);
                renderDecisions();
                return;
            }
            if (allDecisions.length < operatorTotalCount) {
                currentFetchLimit = Math.min(currentFetchLimit + OPERATOR_FETCH_BATCH, operatorTotalCount);
                visibleDecisionCount = Math.min(
                    visibleDecisionCount + OPERATOR_RENDER_BATCH,
                    currentFetchLimit,
                );
                loadDecisions(true);
            }
        }

        function toggleDetails(btn) {
            const section = btn.nextElementSibling;
            section.classList.toggle('visible');
            btn.textContent = section.classList.contains('visible') ? 'Hide matchup details' : 'Show matchup details';
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Verdict filter buttons (exclude sport filter buttons)
        document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.dataset.filter;
                renderDecisions();
            });
        });

        window.addEventListener('pageshow', event => {
            if (event.persisted) {
                ensureDecisionRefreshTimer();
                loadDecisions(true);
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                loadDecisions();
            }
        });

        window.addEventListener('pagehide', () => {
            abortDecisionFetch();
            if (operatorRefreshTimer) {
                clearInterval(operatorRefreshTimer);
                operatorRefreshTimer = null;
            }
        });

        loadDecisions(true);
        ensureDecisionRefreshTimer();
    </script>
</body>
</html>
